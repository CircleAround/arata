# arata 用の読み取り専用ロール (監査対象のアカウントに置く)。
#
# - 権限は arata の collector が呼ぶ API だけ (README「週次チェック」の表、設計書 8 章、`arata doctor` の表の最後)。
#   書き込み系は iam:GenerateCredentialReport (認証情報レポートの生成) だけ。拒否しても 4 時間以内のレポートがあれば arata はそれを使う
# - 信頼する主体はパラメータ。AWS の主体 (TrustedPrincipalArn) と IAM Roles Anywhere (RolesAnywhereTrustAnchorArn) の
#   どちらか、または両方を指定する。どちらも空ならスタックを作らせない (Rules)
# - TrustedPrincipalArn が別のアカウントの主体なら、その引き受けはこのアカウントの CloudTrail に「外部アカウントの AssumeRole」として残る。
#   既知リストに無いと unknown_assume_role が監査そのものを high で報告するので、設定を arata config init --audit-account <そのアカウントの ID> で作る (ADR 0045)
# - ログの中身を読めるロググループは AllowedLogGroupNames に並べたものだけ (ADR 0062)。既定は無く、必ず値を渡す
#   (既にあるスタックの更新でも要る)。値は arata の設定から `arata config role-params` で作る (sources の log_group の一覧)。
#   全部のロググループを読ませる (ADR 0062 より前と同じ) なら `*`、どのロググループも読ませない (ロググループのソースが無い) なら `none` と書く
#   (どちらも値の全体がその 1 語のときだけ。`none` という名前のロググループは読ませられない)。一覧に入れる前に、そのロググループの中身の種類を確かめる
#   (利用者の操作のログ・個人情報が混ざっていないか。arata には判断できない)。一覧に無いソースは、run で ACCESS_DENIED になる
# - 監査のロールにも読ませたくないロググループ (個人情報だけを書くログなど) は DeniedLogGroupNames に名前を書く。中身を読む操作を明示の Deny で止める
#   (ADR 0053)。そのロググループは arata の設定の sources に書かない (書くと、そのソースだけが ACCESS_DENIED になる)
# - CloudTrail を trail の S3 への配信から読む (cloudtrail-s3。ADR 0063) なら、CloudTrailBucketName にバケットの名前を渡す
#   (と、接頭辞があれば CloudTrailBucketPrefix、SSE-KMS なら CloudTrailKmsKeyArn)。読ませるのは <接頭辞>/AWSLogs/ の下の GetObject と、
#   そのキーの一覧 (ListBucket) だけ。どれも既定は空で、空なら S3・KMS の文を出さない (今までのロールと同じ)。値は `arata config role-params` が設定から作る。
#   バケットがログ用の別のアカウントにある (組織の trail) なら、そのバケットのバケットポリシーと KMS キーのキーポリシーでも、このロールを許す必要がある
# - CDK を使わずに配れるよう素の CloudFormation にしている。開発用の sandbox (deploy/sandbox) はこのファイルを CfnInclude で取り込む
#   (定義は 1 か所。ADR 0020)。action の過不足は internal/engine/readonly_role_test.go が Go の collector と突き合わせて確かめる
#
# 例:
#   aws cloudformation deploy --stack-name arata-readonly --template-file readonly-role.yaml \
#     --capabilities CAPABILITY_NAMED_IAM \
#     --parameter-overrides TrustedPrincipalArn=arn:aws:iam::123456789012:role/arata-runner \
#       AllowedLogGroupNames=prod-nginx-access,prod-api
#
# 全部のロググループを読ませる (絞らない) なら AllowedLogGroupNames='*' (シェルが * を展開しないよう引用符で囲む)。
#
# 読ませるロググループを足す・読ませないロググループを足す (既にあるスタックの更新も同じコマンド。書かなかったパラメータは前の値のまま):
#   aws cloudformation deploy --stack-name arata-readonly --template-file readonly-role.yaml \
#     --capabilities CAPABILITY_NAMED_IAM \
#     --parameter-overrides AllowedLogGroupNames=prod-nginx-access,prod-api DeniedLogGroupNames=prod-mail-delivery,prod-mail-bounce
AWSTemplateFormatVersion: '2010-09-09'
Description: arata read-only audit role

Parameters:
  RoleName:
    Type: String
    Default: arata-readonly
    AllowedPattern: '[\w+=,.@-]{1,64}'
    Description: 作るロールの名前
  TrustedPrincipalArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:aws[a-z-]*:(iam|sts)::\d{12}:.+$'
    Description: AssumeRole を許す AWS の主体の ARN (例 arn:aws:iam::123456789012:role/arata-runner)。空なら許さない
  ExternalId:
    Type: String
    Default: ''
    Description: TrustedPrincipalArn からの AssumeRole に要求する ExternalId。空なら要求しない
  RolesAnywhereTrustAnchorArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:aws[a-z-]*:rolesanywhere:[a-z0-9-]+:\d{12}:trust-anchor/.+$'
    Description: IAM Roles Anywhere のトラストアンカーの ARN。空なら Roles Anywhere からは引き受けさせない
  AllowedLogGroupNames:
    Type: String
    # 既定は書かない (ADR 0062)。書かなかった更新は CloudFormation が止める (黙って全部を読める・全部が読めない、にしない)
    # `*` 1 文字だけが「全部」、`none` 1 語だけが「どれも読ませない」(名前の規則にも合うが、Condition で予約語として扱う)。ほかは DeniedLogGroupNames と同じ文字の規則 (部分的なワイルドカード・空白・コロン・空の要素は通さない)
    AllowedPattern: '^\*$|^[A-Za-z0-9_./#-]+(,[A-Za-z0-9_./#-]+)*$'
    ConstraintDescription: ロググループの名前 (英数字と _ - / . #) をカンマで区切って書くか、全部を読ませるなら * だけ、どれも読ませないなら none だけを書いてください。空・空白・部分的なワイルドカード (prod-*)・ARN は書けません
    Description: このロールにログの中身を読ませるロググループの名前 (完全一致。カンマ区切り。例 prod-nginx-access,prod-api)。全部を読ませるなら *、どれも読ませないなら none。arata config role-params が設定から作る
  DeniedLogGroupNames:
    Type: String
    Default: ''
    # 名前に使える文字 (英数字と _ - / . #) だけ。ワイルドカード (* ?)・空白・コロン・空の要素は通さない
    # (`*` 1 つで全部のロググループを止める、前後の空白で 1 つも当たらない、を黙って通さないため)
    AllowedPattern: '^$|^[A-Za-z0-9_./#-]+(,[A-Za-z0-9_./#-]+)*$'
    ConstraintDescription: ロググループの名前 (英数字と _ - / . #) をカンマで区切って書いてください。空白・ワイルドカード (* ?)・ARN は書けません
    Description: このロールに中身を読ませないロググループの名前 (完全一致。カンマ区切り。例 prod-mail-delivery,prod-mail-bounce)。空なら何も止めない
  CloudTrailBucketName:
    Type: String
    Default: ''
    # S3 の汎用バケットの名前の規則 (ARN・s3://・ワイルドカードは通さない)
    AllowedPattern: '^$|^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
    ConstraintDescription: バケットの名前だけ (小文字・数字・. ・-) を書いてください。ARN や s3:// は書けません
    Description: cloudtrail-s3 で読む、trail の配信先のバケットの名前 (ADR 0063)。空なら S3 を読ませない。arata config role-params が設定から作る
  CloudTrailBucketPrefix:
    Type: String
    Default: ''
    # trail の S3KeyPrefix (AWSLogs/ の手前まで)。先頭と末尾の / は書かない。ワイルドカード (* ?) は通さない (読ませる範囲が広がるため)
    AllowedPattern: "^$|^[A-Za-z0-9!_.'()-]+(/[A-Za-z0-9!_.'()-]+)*$"
    ConstraintDescription: trail の S3 キーの接頭辞を、先頭と末尾の / を付けずに書いてください。ワイルドカード (* ?) は書けません
    Description: trail の S3 キーの接頭辞 (AWSLogs/ の手前まで。例 logs)。無ければ空
  CloudTrailKmsKeyArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:aws[a-z-]*:kms:[a-z0-9-]+:\d{12}:key/[A-Za-z0-9-]+$'
    ConstraintDescription: KMS キーの ARN (arn:aws:kms:<リージョン>:<アカウント>:key/<キー ID>) を書いてください。エイリアスは書けません
    Description: trail のファイルを暗号化している KMS キーの ARN (SSE-KMS のとき)。空なら KMS の文を出さない (SSE-S3 なら空)

Conditions:
  HasTrustedPrincipal: !Not [!Equals [!Ref TrustedPrincipalArn, '']]
  HasExternalId: !Not [!Equals [!Ref ExternalId, '']]
  HasRolesAnywhere: !Not [!Equals [!Ref RolesAnywhereTrustAnchorArn, '']]
  HasDeniedLogGroups: !Not [!Equals [!Ref DeniedLogGroupNames, '']]
  AllowAllLogGroups: !Equals [!Ref AllowedLogGroupNames, '*']
  AllowNoLogGroups: !Equals [!Ref AllowedLogGroupNames, 'none']
  HasTrailBucket: !Not [!Equals [!Ref CloudTrailBucketName, '']]
  HasTrailPrefix: !Not [!Equals [!Ref CloudTrailBucketPrefix, '']]
  HasTrailKmsKey: !Not [!Equals [!Ref CloudTrailKmsKeyArn, '']]

Rules:
  RequireTrust:
    Assertions:
      - Assert: !Or
          - !Not [!Equals [!Ref TrustedPrincipalArn, '']]
          - !Not [!Equals [!Ref RolesAnywhereTrustAnchorArn, '']]
        AssertDescription: TrustedPrincipalArn と RolesAnywhereTrustAnchorArn のどちらかを指定してください

Resources:
  Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      Description: arata read-only audit role (GenerateCredentialReport is the only write action)
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - !If
            - HasTrustedPrincipal
            - Effect: Allow
              Principal:
                AWS: !Ref TrustedPrincipalArn
              Action: sts:AssumeRole
              Condition: !If
                - HasExternalId
                - StringEquals:
                    sts:ExternalId: !Ref ExternalId
                - !Ref AWS::NoValue
            - !Ref AWS::NoValue
          - !If
            - HasRolesAnywhere
            - Effect: Allow
              Principal:
                Service: rolesanywhere.amazonaws.com
              Action:
                - sts:AssumeRole
                - sts:TagSession
                - sts:SetSourceIdentity
              Condition:
                ArnEquals:
                  aws:SourceArn: !Ref RolesAnywhereTrustAnchorArn
            - !Ref AWS::NoValue
      Policies:
        - PolicyName: arata-readonly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # cloudtrail-lookup
              - Sid: CloudTrailLookup
                Effect: Allow
                Action:
                  - cloudtrail:LookupEvents
                Resource: '*'
              # doctor が cloudtrail-s3 の trail の記録の範囲 (管理イベントの読み取り・書き込み、除いた種類) を確かめる (ADR 0063)。設定を読むだけ
              - Sid: CloudTrailSelectors
                Effect: Allow
                Action:
                  - cloudtrail:GetEventSelectors
                Resource: '*'
              # cloudtrail-s3 (trail の S3 への配信。ADR 0063)。CloudTrailBucketName が空ならどちらの文も出さない
              # - 読ませるのは <接頭辞>/AWSLogs/ の下だけ (一覧は s3:prefix の条件で、読み取りはキーの ARN で絞る)。バケットの設定・ACL は読ませない
              # - 公式の共有の例は s3:Get* と s3:List* だが、読み取り専用を保つため GetObject と ListBucket だけにする
              # - パーティションは `*` (上の Logs と同じ。!Sub を使わない)
              - !If
                - HasTrailBucket
                - Sid: CloudTrailS3List
                  Effect: Allow
                  Action:
                    - s3:ListBucket
                  Resource: !Join ['', ['arn:*:s3:::', !Ref CloudTrailBucketName]]
                  Condition:
                    StringLike:
                      s3:prefix: !If [HasTrailPrefix, !Join ['', [!Ref CloudTrailBucketPrefix, '/AWSLogs/*']], 'AWSLogs/*']
                - !Ref AWS::NoValue
              - !If
                - HasTrailBucket
                - Sid: CloudTrailS3Read
                  Effect: Allow
                  Action:
                    - s3:GetObject
                  Resource: !If
                    - HasTrailPrefix
                    - !Join ['', ['arn:*:s3:::', !Ref CloudTrailBucketName, '/', !Ref CloudTrailBucketPrefix, '/AWSLogs/*']]
                    - !Join ['', ['arn:*:s3:::', !Ref CloudTrailBucketName, '/AWSLogs/*']]
                - !Ref AWS::NoValue
              # SSE-KMS の trail のファイルの復号。条件は公式のキーポリシーの例と同じ (CloudTrail が暗号化したものだけ)。
              # キーが別のアカウントにあれば、そのキーポリシーでもこのロールを許す必要がある
              - !If
                - HasTrailKmsKey
                - Sid: CloudTrailKmsDecrypt
                  Effect: Allow
                  Action:
                    - kms:Decrypt
                  Resource: !Ref CloudTrailKmsKeyArn
                  Condition:
                    'Null':
                      kms:EncryptionContext:aws:cloudtrail:arn: 'false'
                - !Ref AWS::NoValue
              # cloudwatch-logs (Logs Insights の集計クエリ。doctor の解釈率の確認も同じ action)
              # 一覧とクエリの停止。どちらもリソースの型を持たない (Service Authorization Reference) ので絞れない。ログの中身は返さない
              - Sid: CloudWatchLogsList
                Effect: Allow
                Action:
                  - logs:DescribeLogGroups
                  - logs:StopQuery
                Resource: '*'
              # ログの中身を読む Logs Insights の action は、AllowedLogGroupNames のロググループだけ (ADR 0062)。`*` なら全部
              # - ARN の組み立ては下の DenyLogGroupRead と同じ (名前ごとに `…:log-group:<名前>` と `…:log-group:<名前>:*`。完全一致。
              #   リージョン・アカウント・パーティションは `*`)。一覧に無いロググループは、この Allow が無いので暗黙の拒否
              # - ほかの中身を読む action (FilterLogEvents・GetLogEvents など) は、もともとこのロールに無い
              # - none ならこの文を出さない (Resource を空にはできない)。一覧の文は残る
              - !If
                - AllowNoLogGroups
                - !Ref AWS::NoValue
                - Sid: CloudWatchLogsInsights
                  Effect: Allow
                  Action:
                    - logs:StartQuery
                    - logs:GetQueryResults
                  Resource: !If
                    - AllowAllLogGroups
                    - '*'
                    - !Split
                      - ','
                      - !Join
                        - ''
                        - - 'arn:*:logs:*:*:log-group:'
                          - !Join [',arn:*:logs:*:*:log-group:', !Split [',', !Ref AllowedLogGroupNames]]
                          - ',arn:*:logs:*:*:log-group:'
                          - !Join [':*,arn:*:logs:*:*:log-group:', !Split [',', !Ref AllowedLogGroupNames]]
                          - ':*'
              # iam-credential-report。GenerateCredentialReport は書き込み系 (レポートの生成のみ)
              - Sid: CredentialReport
                Effect: Allow
                Action:
                  - iam:GenerateCredentialReport
                  - iam:GetCredentialReport
                Resource: '*'
              # guardduty / posture
              - Sid: GuardDuty
                Effect: Allow
                Action:
                  - guardduty:ListDetectors
                  - guardduty:GetDetector
                  - guardduty:ListFindings
                  - guardduty:GetFindings
                Resource: '*'
              # access-analyzer
              - Sid: AccessAnalyzer
                Effect: Allow
                Action:
                  - access-analyzer:ListAnalyzers
                  - access-analyzer:ListFindings
                Resource: '*'
              # posture
              - Sid: Posture
                Effect: Allow
                Action:
                  - cloudtrail:DescribeTrails
                  - cloudtrail:GetTrailStatus
                  - iam:GetAccountSummary
                  - iam:GetAccountPasswordPolicy
                  - s3:GetAccountPublicAccessBlock
                  # インターネット向けの ALB に WebACL が付いているか (一覧と、ALB ごとの WebACL の有無。ADR 0048)
                  - elasticloadbalancing:DescribeLoadBalancers
                  - wafv2:GetWebACLForResource
                Resource: '*'
              # waf-config (WebACL の設定を読むだけ。waf_review の提案の候補に使う)
              - Sid: WAFConfig
                Effect: Allow
                Action:
                  - wafv2:ListWebACLs
                  - wafv2:GetWebACL
                  - wafv2:GetLoggingConfiguration
                  - wafv2:ListResourcesForWebACL
                Resource: '*'
              # cloudtrail-unused-regions (有効なリージョンの一覧。各リージョンの LookupEvents は上の CloudTrailLookup)
              - Sid: UnusedRegions
                Effect: Allow
                Action:
                  - account:ListRegions
                Resource: '*'
              # cost-anomaly (Cost Anomaly Detection の読み取りだけ。Cost Explorer の API は 1 リクエスト 0.01 USD)
              - Sid: CostAnomaly
                Effect: Allow
                Action:
                  - ce:GetAnomalyMonitors
                  - ce:GetAnomalies
                Resource: '*'
              # DeniedLogGroupNames のロググループの中身を読ませない (ADR 0053)。空ならこの文は出ない。
              # - 明示の Deny。上の Allow から外すだけにしないのは、後からほかのポリシー (管理ポリシーなど) が付いても効くようにするため
              # - action は、ログの行・項目の値を返す操作 (ロググループ / ログストリームを対象に取る Read)。arata が呼ぶのは StartQuery と GetQueryResults だけ。
              #   一覧 (DescribeLogGroups) と StopQuery は中身を返さないので止めない (doctor の log_group は名前の一致を見られる)
              # - 決定: リージョン・アカウント・パーティションは `*`。IAM のロールはリージョンを持たず、arata のソースはリージョンごとに書けるので、
              #   どのリージョンの同じ名前のロググループも読ませない (止めすぎる側に倒す。スタックを置いたリージョンに依らない)。
              #   アカウントとパーティションが `*` なのは、名前の並びに接頭辞を付ける !Join の区切りに関数 (AWS::AccountId など) を書けないため
              # - 名前ごとに 2 つの ARN。`…:log-group:<名前>` はロググループそのもの (StartQuery・FilterLogEvents など)、
              #   `…:log-group:<名前>:*` はその下のログストリーム (GetLogEvents)。名前は完全一致で、`prod-mail` は `prod-mail-2` に当たらない
              # - 複数のロググループを 1 回で問い合わせる StartQuery は、その中に 1 つでもここに当たるものがあれば、問い合わせ全体が拒否される
              #   (IAM は明示の Deny を優先する。IAM のポリシーシミュレーターで確かめた)。arata は 1 回に 1 つのロググループしか問い合わせないので、ほかのソースには影響しない
              - !If
                - HasDeniedLogGroups
                - Sid: DenyLogGroupRead
                  Effect: Deny
                  Action:
                    - logs:StartQuery
                    - logs:GetQueryResults
                    - logs:GetLogRecord
                    - logs:GetLogEvents
                    - logs:FilterLogEvents
                    - logs:StartLiveTail
                    - logs:GetLogGroupFields
                    - logs:Unmask
                  Resource: !Split
                    - ','
                    - !Join
                      - ''
                      - - 'arn:*:logs:*:*:log-group:'
                        - !Join [',arn:*:logs:*:*:log-group:', !Split [',', !Ref DeniedLogGroupNames]]
                        - ',arn:*:logs:*:*:log-group:'
                        - !Join [':*,arn:*:logs:*:*:log-group:', !Split [',', !Ref DeniedLogGroupNames]]
                        - ':*'
                - !Ref AWS::NoValue

Outputs:
  RoleArn:
    Description: arata の設定 (AWS の profile の role_arn など) に書くロールの ARN
    Value: !GetAtt Role.Arn
