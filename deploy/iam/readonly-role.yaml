# arata 用の読み取り専用ロール (監査対象のアカウントに置く)。
#
# - 権限は arata の collector が呼ぶ API だけ (README「週次チェック」の表、設計書 8 章、`arata doctor` の表の最後)。
#   書き込み系は iam:GenerateCredentialReport (認証情報レポートの生成) だけ。拒否しても 4 時間以内のレポートがあれば arata はそれを使う
# - 信頼する主体はパラメータ。AWS の主体 (TrustedPrincipalArn) と IAM Roles Anywhere (RolesAnywhereTrustAnchorArn) の
#   どちらか、または両方を指定する。どちらも空ならスタックを作らせない (Rules)
# - TrustedPrincipalArn が別のアカウントの主体なら、その引き受けはこのアカウントの CloudTrail に「外部アカウントの AssumeRole」として残る。
#   既知リストに無いと unknown_assume_role が監査そのものを high で報告するので、設定を arata config init --audit-account <そのアカウントの ID> で作る (ADR 0045)
# - 監査のロールにも読ませたくないロググループ (個人情報だけを書くログなど) は DeniedLogGroupNames に名前を書く。中身を読む操作を明示の Deny で止める
#   (ADR 0053)。そのロググループは arata の設定の sources に書かない (書くと、そのソースだけが ACCESS_DENIED になる)
# - CDK を使わずに配れるよう素の CloudFormation にしている。開発用の sandbox (deploy/sandbox) はこのファイルを CfnInclude で取り込む
#   (定義は 1 か所。ADR 0020)。action の過不足は internal/engine/readonly_role_test.go が Go の collector と突き合わせて確かめる
#
# 例:
#   aws cloudformation deploy --stack-name arata-readonly --template-file readonly-role.yaml \
#     --capabilities CAPABILITY_NAMED_IAM \
#     --parameter-overrides TrustedPrincipalArn=arn:aws:iam::123456789012:role/arata-runner
#
# 読ませないロググループを足す (既にあるスタックの更新も同じコマンド。書かなかったパラメータは前の値のまま):
#   aws cloudformation deploy --stack-name arata-readonly --template-file readonly-role.yaml \
#     --capabilities CAPABILITY_NAMED_IAM \
#     --parameter-overrides DeniedLogGroupNames=prod-mail-delivery,prod-mail-bounce
AWSTemplateFormatVersion: '2010-09-09'
Description: arata read-only audit role

Parameters:
  RoleName:
    Type: String
    Default: arata-readonly
    AllowedPattern: '[\w+=,.@-]{1,64}'
    Description: 作るロールの名前
  TrustedPrincipalArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:aws[a-z-]*:(iam|sts)::\d{12}:.+$'
    Description: AssumeRole を許す AWS の主体の ARN (例 arn:aws:iam::123456789012:role/arata-runner)。空なら許さない
  ExternalId:
    Type: String
    Default: ''
    Description: TrustedPrincipalArn からの AssumeRole に要求する ExternalId。空なら要求しない
  RolesAnywhereTrustAnchorArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:aws[a-z-]*:rolesanywhere:[a-z0-9-]+:\d{12}:trust-anchor/.+$'
    Description: IAM Roles Anywhere のトラストアンカーの ARN。空なら Roles Anywhere からは引き受けさせない
  DeniedLogGroupNames:
    Type: String
    Default: ''
    # 名前に使える文字 (英数字と _ - / . #) だけ。ワイルドカード (* ?)・空白・コロン・空の要素は通さない
    # (`*` 1 つで全部のロググループを止める、前後の空白で 1 つも当たらない、を黙って通さないため)
    AllowedPattern: '^$|^[A-Za-z0-9_./#-]+(,[A-Za-z0-9_./#-]+)*$'
    ConstraintDescription: ロググループの名前 (英数字と _ - / . #) をカンマで区切って書いてください。空白・ワイルドカード (* ?)・ARN は書けません
    Description: このロールに中身を読ませないロググループの名前 (完全一致。カンマ区切り。例 prod-mail-delivery,prod-mail-bounce)。空なら何も止めない

Conditions:
  HasTrustedPrincipal: !Not [!Equals [!Ref TrustedPrincipalArn, '']]
  HasExternalId: !Not [!Equals [!Ref ExternalId, '']]
  HasRolesAnywhere: !Not [!Equals [!Ref RolesAnywhereTrustAnchorArn, '']]
  HasDeniedLogGroups: !Not [!Equals [!Ref DeniedLogGroupNames, '']]

Rules:
  RequireTrust:
    Assertions:
      - Assert: !Or
          - !Not [!Equals [!Ref TrustedPrincipalArn, '']]
          - !Not [!Equals [!Ref RolesAnywhereTrustAnchorArn, '']]
        AssertDescription: TrustedPrincipalArn と RolesAnywhereTrustAnchorArn のどちらかを指定してください

Resources:
  Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      Description: arata read-only audit role (GenerateCredentialReport is the only write action)
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - !If
            - HasTrustedPrincipal
            - Effect: Allow
              Principal:
                AWS: !Ref TrustedPrincipalArn
              Action: sts:AssumeRole
              Condition: !If
                - HasExternalId
                - StringEquals:
                    sts:ExternalId: !Ref ExternalId
                - !Ref AWS::NoValue
            - !Ref AWS::NoValue
          - !If
            - HasRolesAnywhere
            - Effect: Allow
              Principal:
                Service: rolesanywhere.amazonaws.com
              Action:
                - sts:AssumeRole
                - sts:TagSession
                - sts:SetSourceIdentity
              Condition:
                ArnEquals:
                  aws:SourceArn: !Ref RolesAnywhereTrustAnchorArn
            - !Ref AWS::NoValue
      Policies:
        - PolicyName: arata-readonly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # cloudtrail-lookup
              - Sid: CloudTrailLookup
                Effect: Allow
                Action:
                  - cloudtrail:LookupEvents
                Resource: '*'
              # cloudwatch-logs (Logs Insights の集計クエリ。doctor の解釈率の確認も同じ action)
              - Sid: CloudWatchLogsInsights
                Effect: Allow
                Action:
                  - logs:DescribeLogGroups
                  - logs:StartQuery
                  - logs:GetQueryResults
                  - logs:StopQuery
                Resource: '*'
              # iam-credential-report。GenerateCredentialReport は書き込み系 (レポートの生成のみ)
              - Sid: CredentialReport
                Effect: Allow
                Action:
                  - iam:GenerateCredentialReport
                  - iam:GetCredentialReport
                Resource: '*'
              # guardduty / posture
              - Sid: GuardDuty
                Effect: Allow
                Action:
                  - guardduty:ListDetectors
                  - guardduty:GetDetector
                  - guardduty:ListFindings
                  - guardduty:GetFindings
                Resource: '*'
              # access-analyzer
              - Sid: AccessAnalyzer
                Effect: Allow
                Action:
                  - access-analyzer:ListAnalyzers
                  - access-analyzer:ListFindings
                Resource: '*'
              # posture
              - Sid: Posture
                Effect: Allow
                Action:
                  - cloudtrail:DescribeTrails
                  - cloudtrail:GetTrailStatus
                  - iam:GetAccountSummary
                  - iam:GetAccountPasswordPolicy
                  - s3:GetAccountPublicAccessBlock
                  # インターネット向けの ALB に WebACL が付いているか (一覧と、ALB ごとの WebACL の有無。ADR 0048)
                  - elasticloadbalancing:DescribeLoadBalancers
                  - wafv2:GetWebACLForResource
                Resource: '*'
              # waf-config (WebACL の設定を読むだけ。waf_review の提案の候補に使う)
              - Sid: WAFConfig
                Effect: Allow
                Action:
                  - wafv2:ListWebACLs
                  - wafv2:GetWebACL
                  - wafv2:GetLoggingConfiguration
                  - wafv2:ListResourcesForWebACL
                Resource: '*'
              # cloudtrail-unused-regions (有効なリージョンの一覧。各リージョンの LookupEvents は上の CloudTrailLookup)
              - Sid: UnusedRegions
                Effect: Allow
                Action:
                  - account:ListRegions
                Resource: '*'
              # cost-anomaly (Cost Anomaly Detection の読み取りだけ。Cost Explorer の API は 1 リクエスト 0.01 USD)
              - Sid: CostAnomaly
                Effect: Allow
                Action:
                  - ce:GetAnomalyMonitors
                  - ce:GetAnomalies
                Resource: '*'
              # DeniedLogGroupNames のロググループの中身を読ませない (ADR 0053)。空ならこの文は出ない。
              # - 明示の Deny。上の Allow から外すだけにしないのは、後からほかのポリシー (管理ポリシーなど) が付いても効くようにするため
              # - action は、ログの行・項目の値を返す操作 (ロググループ / ログストリームを対象に取る Read)。arata が呼ぶのは StartQuery と GetQueryResults だけ。
              #   一覧 (DescribeLogGroups) と StopQuery は中身を返さないので止めない (doctor の log_group は名前の一致を見られる)
              # - 決定: リージョン・アカウント・パーティションは `*`。IAM のロールはリージョンを持たず、arata のソースはリージョンごとに書けるので、
              #   どのリージョンの同じ名前のロググループも読ませない (止めすぎる側に倒す。スタックを置いたリージョンに依らない)。
              #   アカウントとパーティションが `*` なのは、名前の並びに接頭辞を付ける !Join の区切りに関数 (AWS::AccountId など) を書けないため
              # - 名前ごとに 2 つの ARN。`…:log-group:<名前>` はロググループそのもの (StartQuery・FilterLogEvents など)、
              #   `…:log-group:<名前>:*` はその下のログストリーム (GetLogEvents)。名前は完全一致で、`prod-mail` は `prod-mail-2` に当たらない
              # - 複数のロググループを 1 回で問い合わせる StartQuery は、その中に 1 つでもここに当たるものがあれば、問い合わせ全体が拒否される見込み
              #   (IAM は明示の Deny を優先する)。arata は 1 回に 1 つのロググループしか問い合わせないので、ほかのソースには影響しない
              - !If
                - HasDeniedLogGroups
                - Sid: DenyLogGroupRead
                  Effect: Deny
                  Action:
                    - logs:StartQuery
                    - logs:GetQueryResults
                    - logs:GetLogRecord
                    - logs:GetLogEvents
                    - logs:FilterLogEvents
                    - logs:StartLiveTail
                    - logs:GetLogGroupFields
                    - logs:Unmask
                  Resource: !Split
                    - ','
                    - !Join
                      - ''
                      - - 'arn:*:logs:*:*:log-group:'
                        - !Join [',arn:*:logs:*:*:log-group:', !Split [',', !Ref DeniedLogGroupNames]]
                        - ',arn:*:logs:*:*:log-group:'
                        - !Join [':*,arn:*:logs:*:*:log-group:', !Split [',', !Ref DeniedLogGroupNames]]
                        - ':*'
                - !Ref AWS::NoValue

Outputs:
  RoleArn:
    Description: arata の設定 (AWS の profile の role_arn など) に書くロールの ARN
    Value: !GetAtt Role.Arn
