# 依存の更新 PR。公開から 7 日経った版だけを提案する (cooldown)。CI の age-gate (tools/agegate) と 2 段構え (ADR 0017)。
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      aws-sdk:
        patterns: ["github.com/aws/*"]
  # /examples/audit-repo は arata repo init の出力そのもの (ADR 0059)。.github/workflows の外なので明示する (ADR 0035)。
  # ここへの更新 PR は、そのままではテスト (見本と雛形の一致) が落ちる。同じ変更を internal/repoinit/templates に入れて見本を作り直す
  - package-ecosystem: github-actions
    directories: ["/", "/examples/audit-repo/.github/workflows"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  # deploy/sandbox (CDK)。pnpm-lock.yaml を更新する。pnpm 側の minimumReleaseAge と 2 段構え (ADR 0020)
  - package-ecosystem: npm
    directory: /deploy/sandbox
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      aws-cdk:
        patterns: ["aws-cdk", "aws-cdk-lib", "constructs"]
