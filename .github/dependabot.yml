# 依存の更新 PR。公開から 7 日経った版だけを提案する (cooldown)。CI の age-gate (tools/agegate) と 2 段構え (ADR 0017)。
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      aws-sdk:
        patterns: ["github.com/aws/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  # deploy/sandbox (CDK)。pnpm-lock.yaml を更新する。pnpm 側の minimumReleaseAge と 2 段構え (ADR 0020)
  - package-ecosystem: npm
    directory: /deploy/sandbox
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      aws-cdk:
        patterns: ["aws-cdk", "aws-cdk-lib", "constructs"]
