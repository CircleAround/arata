name: secrets-scan

# 公開できない情報がリポジトリと GitHub の本文に入っていないかを確かめる (ADR 0036、運用は docs/sensitive-scan.md)。
# - gitleaks: 一般的な秘密と 12 桁の数字・公開 IP・メール (.gitleaks.toml)。secrets が要らないので常に回る
# - words: 禁止語 (tools/wordscan)。語の一覧は secrets の SENSITIVE_PATTERNS にある
# - github-text: PR・Issue・コメント・Release の本文。定期実行のみ
# pull_request_target は使わない (フォークのコードに secrets を渡さない)。
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  schedule:
    - cron: "23 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: gitleaks を入れる (版とチェックサムを固定)
        run: tools/install-gitleaks.sh "$RUNNER_TEMP/bin"
      - name: 全履歴の差分
        run: '"$RUNNER_TEMP/bin/gitleaks" git --no-banner --redact -c .gitleaks.toml --log-opts=--all .'
      - name: コミットメッセージ (gitleaks は git モードでは読まない)
        run: git log --all --format=%B | "$RUNNER_TEMP/bin/gitleaks" stdin --no-banner --redact -c .gitleaks.toml
      - name: この PR のタイトルと本文
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" | "$RUNNER_TEMP/bin/gitleaks" stdin --no-banner --redact -c .gitleaks.toml

  words:
    runs-on: ubuntu-24.04-arm
    steps:
      # フォークと Dependabot の PR には secrets が渡らない。ここで飛ばしても main への push と定期実行で必ず読む。
      # それ以外で SENSITIVE_PATTERNS が空なら wordscan が失敗する (黙って通さない)
      - name: secrets を読める実行か
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT" = pull_request ] && { [ "$HEAD_REPO" != "$REPO" ] || [ "$PR_AUTHOR" = 'dependabot[bot]' ]; }; then
            echo "::notice::secrets を読めない PR なので禁止語の検査を飛ばします。main への push と定期実行で検査します"
            echo "skip=true" >>"$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.skip != 'true'
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.gate.outputs.skip != 'true'
        with:
          go-version-file: go.mod
          cache: false
      - name: wordscan を作る
        if: steps.gate.outputs.skip != 'true'
        run: go build -o "$RUNNER_TEMP/wordscan" ./tools/wordscan
      - name: 全履歴の禁止語 (ログに語を出さない)
        if: steps.gate.outputs.skip != 'true'
        env:
          SENSITIVE_PATTERNS: ${{ secrets.SENSITIVE_PATTERNS }}
        run: '"$RUNNER_TEMP/wordscan" -mode history'
      - name: この PR のタイトルと本文の禁止語
        if: steps.gate.outputs.skip != 'true' && github.event_name == 'pull_request'
        env:
          SENSITIVE_PATTERNS: ${{ secrets.SENSITIVE_PATTERNS }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          mkdir "$RUNNER_TEMP/pr"
          printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" >"$RUNNER_TEMP/pr/this-pr.txt"
          "$RUNNER_TEMP/wordscan" -mode dir -dir "$RUNNER_TEMP/pr"

  github-text:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go build -o "$RUNNER_TEMP/wordscan" ./tools/wordscan
      - run: tools/install-gitleaks.sh "$RUNNER_TEMP/bin"
      - name: 本文を書き出す
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: tools/github-text.sh "$REPO" "$RUNNER_TEMP/text"
      - name: 一般的な秘密
        run: '"$RUNNER_TEMP/bin/gitleaks" dir --no-banner --redact -c .gitleaks.toml "$RUNNER_TEMP/text"'
      - name: 禁止語 (自動生成のノートの @login は除く)
        env:
          SENSITIVE_PATTERNS: ${{ secrets.SENSITIVE_PATTERNS }}
        run: '"$RUNNER_TEMP/wordscan" -mode dir -dir "$RUNNER_TEMP/text" -github-notes'
