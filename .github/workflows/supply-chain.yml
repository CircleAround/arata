name: supply-chain

# サプライチェーンの検査 (ADR 0017・0035)。PR と main に加えて週次でも回す。
# コードが変わらなくても、依存に新しい脆弱性が見つかることと、action のタグが動くことがあるため。
# 検査の道具も固定する: Go 製は `go run pkg@version` (sum.golang.org で検証)、それ以外はリリースのバイナリを sha256 で照合する。
# 版を上げるときは公開から 7 日以上の版を選ぶ (docs/supply-chain.md「道具の版を上げる」)。
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '27 3 * * 1'   # 毎週月曜 03:27 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  ACTIONLINT: github.com/rhysd/actionlint@v1.7.12
  GOVULNCHECK: golang.org/x/vuln@v1.9.0
  ACTIONS_LOCK: github.com/github/gh-actions-lock@v0.4.0

jobs:
  # uses の固定、コメントの版と SHA の一致、7 日待機、ロックファイル、ワークフローの構文
  actions:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: age-gate (CI の Go 製の道具も公開から 7 日以上)
        run: go list -m -json "$ACTIONLINT" "$GOVULNCHECK" "$ACTIONS_LOCK" | go run ./tools/agegate -days 7
      - name: actions-gate (SHA 固定・版の一致・公開から 7 日以上)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: go run ./tools/actionsgate -days 7 -lock .github/workflows/actions.lock .github/workflows examples/audit-repo/.github/workflows
      # 見本 (examples/audit-repo) は、知らせのチャンネルを使う形。知らせを使わない形 (--alert-channel none) は、ここで書き出して確かめる (ADR 0060)。
      # 引数はすべて架空の値。GitHub にも AWS にも繋がない
      - name: 知らせを使わない形の一式を書き出す
        run: |
          go run ./cmd/arata repo init --owner example-org --repo security-audit --accounts prod,staging --audit-account 111122223333 \
            --store-bucket example-arata-store --region ap-northeast-1 --alert-channel none \
            --channel prod=C0123456789,staging=C0123456781 --urgent-channel prod=C0123456780,staging=same \
            --schedule --arata-version v0.15.0 --out "$RUNNER_TEMP/no-alert"
      - name: actionlint
        run: go run "${ACTIONLINT/@//cmd/actionlint@}" .github/workflows/*.yml examples/audit-repo/.github/workflows/*.yml "$RUNNER_TEMP"/no-alert/.github/workflows/*.yml
      # ロックファイルが古い・壊れている・上流と合わないときに落ちる。無いときは読み飛ばす
      - name: workflow lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f .github/workflows/actions.lock ]; then
            echo "actions.lock はまだありません (docs/supply-chain.md)"
            exit 0
          fi
          go run "${ACTIONS_LOCK/@//cmd/gh-actions-lock@}" --verify

  # ワークフローのセキュリティの linter。設定は .github/zizmor.yml
  zizmor:
    runs-on: ubuntu-24.04-arm
    env:
      VERSION: v1.31.1
      SHA256: 37eebbd5762a44f262d94875431b14a6d2402991e90a685113ea97b8b41be833
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # 知らせを使わない形 (--alert-channel none) も確かめる (上の actions のジョブと同じ引数。ADR 0060)
      - name: 知らせを使わない形の一式を書き出す
        run: |
          go run ./cmd/arata repo init --owner example-org --repo security-audit --accounts prod,staging --audit-account 111122223333 \
            --store-bucket example-arata-store --region ap-northeast-1 --alert-channel none \
            --channel prod=C0123456789,staging=C0123456781 --urgent-channel prod=C0123456780,staging=same \
            --schedule --arata-version v0.15.0 --out "$RUNNER_TEMP/no-alert"
      - name: zizmor を取得する
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o zizmor.tar.gz "https://github.com/zizmorcore/zizmor/releases/download/$VERSION/zizmor-aarch64-unknown-linux-gnu.tar.gz"
          echo "$SHA256  zizmor.tar.gz" | sha256sum --check --strict -
          tar -xzf zizmor.tar.gz
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}   # 固定した commit の偽装や既知の脆弱な action を調べるオンラインの検査に使う
        run: '"$RUNNER_TEMP/zizmor" --config .github/zizmor.yml . examples/audit-repo/.github/workflows/*.yml "$RUNNER_TEMP"/no-alert/.github/workflows/*.yml'

  # arata repo init が書き出す GitHub の設定の Terraform (examples/audit-repo は、その出力そのもの。ADR 0059)。
  #   - provider の版が公開から 7 日以上 (レジストリの公開日を読む)
  #   - terraform fmt / validate (書き出した lock のハッシュで、取得した provider を確かめる)
  # plan も apply もしない。この一式の Terraform は秘密に触れない (ADR 0060。秘密の箱をやめたので、偽の GitHub API への apply は無くなった)。
  # 実際の GitHub には接続しない。Terraform 本体は版と sha256 を固定して公式の配布元から取る。
  # Terraform 本体は Go のモジュールでも action でもないので、agegate・actionsgate の対象外。版を上げるときは、
  # 公開から 7 日以上の版を選び、公開日と SHA256SUMS の値を PR に書く (docs/supply-chain.md「道具の版を上げる」)。
  terraform:
    runs-on: ubuntu-24.04-arm
    env:
      TERRAFORM_VERSION: 1.17.1
      TERRAFORM_SHA256: 988e950a1c23058093b0e66ab2d5fb53fc18345ecfbd5871acf51dbac9325edd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: provider-gate (Terraform の provider は公開から 7 日以上)
        run: go run ./tools/tfprovidergate -days 7 examples/audit-repo/github/.terraform.lock.hcl
      - name: terraform を取得する
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o terraform.zip "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_arm64.zip"
          echo "$TERRAFORM_SHA256  terraform.zip" | sha256sum --check --strict -
          mkdir terraform-bin
          unzip -q terraform.zip terraform -d terraform-bin
          echo "$RUNNER_TEMP/terraform-bin" >>"$GITHUB_PATH"
      - name: terraform fmt / validate
        env:
          ARATA_TEST_TERRAFORM: '1'
        run: go test ./internal/repoinit -run 'Terraform' -count=1 -v

  # 依存の既知の脆弱性。Go は呼び出し経路まで見る govulncheck、deploy/sandbox の pnpm の依存は osv-scanner
  vulnerabilities:
    runs-on: ubuntu-24.04-arm
    env:
      OSV_VERSION: v2.7.0
      OSV_SHA256: 4061ef4c021ed3c47f203b818f337e351336cc5cd67c0274fc36bd1dfc728dd7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: govulncheck
        run: go run "${GOVULNCHECK/@//cmd/govulncheck@}" ./...
      - name: osv-scanner を取得する
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o osv-scanner "https://github.com/google/osv-scanner/releases/download/$OSV_VERSION/osv-scanner_linux_arm64"
          echo "$OSV_SHA256  osv-scanner" | sha256sum --check --strict -
          chmod +x osv-scanner
      - name: osv-scanner (deploy/sandbox)
        run: '"$RUNNER_TEMP/osv-scanner" scan source --lockfile deploy/sandbox/pnpm-lock.yaml'
