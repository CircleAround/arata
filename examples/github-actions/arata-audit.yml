# arata と aratam を GitHub Actions で定期実行する見本。
# 利用者のリポジトリの .github/workflows/ に写して使う (arata のリポジトリの CI では動かさない)。
# 用意するもの・費用・注意は同じディレクトリの README.md。例の値はすべて架空。
#
# 利用者のリポジトリに置くもの:
#   arata/arata.yaml         store: s3://... と aws.profile: arata-audit を書く
#   arata/aratam.yaml        slack.webhook_env (bot トークンの方式なら slack.bot_token_env と slack.channel) などを書く
#   arata/allowlist.yaml
#   arata/aratam-context.md  (任意。llm.context_file)
name: arata-audit

on:
  schedule:
    # 時刻は UTC。毎時ちょうどは GitHub の定時実行が混み、遅れたり落ちたりするので避ける。
    # daily を UTC 0 時台の後半にするのは、Logs Insights のスキャンの範囲が半分ほどになるため (arata doctor の cost の行の案内)。
    # 「UTC 0 時 + 窓 (24h) + ingest_delay (15m) + 余裕 15 分」= 00:30 より後ならよい。遅れは費用を増やさない。
    - cron: '40 0 * * *'   # daily (JST 09:40)
    - cron: '10 1 * * 1'   # weekly (月曜 JST 10:10)。下の PROFILE の文字列と揃える
  workflow_dispatch:
    inputs:
      profile:
        description: 実行するプロファイル
        type: choice
        options: [daily, weekly]
        default: daily
      # 試しの実行 (arata run --dry-run)。定時の前に、いま流したら何が出るかだけを見る。
      # ストアに何も書かないので、出た指摘は報告済みにならず、次の定時の実行でも通知される。通知はしない。
      # ARATA_VERSION が v0.11.0 より後の版であること (それより前は --dry-run を知らず、終了コード 2 で止まる。何も書かれない)。
      dry_run:
        description: 試しの実行 (ストアに書かず、通知もしない。結果は件数だけをログに出す)
        type: boolean
        default: false
      window:
        description: 試しの実行で見る期間 (例 1h。空ならプロファイルの window。dry_run のときだけ使う)
        type: string
        default: ''

# 同じストアへの同時実行を止める。走っている run は中断しない (中断すると収集を捨てることになる)。
# 止めきれなくても、後から終わったほうが STORE_CONFLICT で失敗するだけで、ストアは壊れない (ADR 0034)。
# ストアごとに 1 つの group にする。
concurrency:
  # 試しの実行はストアに書かないので group を分ける (同じ group だと、待っている定時の実行を取り消し得る)。
  group: arata-audit-example${{ inputs.dry_run && '-dry-run' || '' }}
  cancel-in-progress: false

permissions: {}

defaults:
  run:
    shell: bash     # -eo pipefail で動く

env:
  ARATA_VERSION: v0.14.0       # v0.14.0 以降にする (送り方の判別に aratam config check --format json が要る)。固定し、上げるときは PR で
  ARATA_CONFIG_DIR: arata
  ARATA_TARGET: example        # 監査対象の名前。最後の alert の連絡に出す (秘密にしたい名前は書かない)
  ARATA_STORE_URL: s3://example-arata-store/example   # arata.yaml の store: と同じ値
  AWS_REGION: ap-northeast-1

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      id-token: write   # OIDC で実行用ロールを引き受ける
      contents: read    # 設定ファイルの checkout
    env:
      PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.profile || (github.event.schedule == '10 1 * * 1' && 'weekly' || 'daily') }}
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # バイナリは認証より先に取る。OIDC が失敗しても aratam で「実行されていない」と知らせるため。
      # 照合の SHA256SUMS は同じリリースのものなので、壊れた取得は防げるがリリース自体のすり替えは防げない。
      # 公開リポジトリのリリースなら gh attestation verify で来歴も確かめられる (arata の README「来歴の検証」)。
      - id: install
        name: arata と aratam を取得する
        env:
          # arata のリポジトリは公開なので、Release は github.token で読める (ほかのトークンは要らない)
          GH_TOKEN: ${{ github.token }}
        run: |
          dir="$RUNNER_TEMP/arata-bin"
          mkdir -p "$dir"
          gh release download "$ARATA_VERSION" -R CircleAround/arata -D "$dir" \
            -p arata-linux-amd64 -p aratam-linux-amd64 -p SHA256SUMS
          cd "$dir"
          for name in arata aratam; do
            grep " ${name}-linux-amd64\$" SHA256SUMS | sha256sum --check --strict --quiet -
            install -m 0755 "${name}-linux-amd64" "$name"
          done
          echo "$dir" >>"$GITHUB_PATH"

      # 実行用ロール。権限は監査ロールの引き受けとストアのバケットの読み書きだけにする。
      # ロールの ARN はアカウント ID を含むので secrets に置く (secrets はログで自動的に隠される)。
      - id: aws
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.ARATA_RUNNER_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: arata-audit
          role-duration-seconds: 3600
          mask-aws-account-id: true

      # 2 つの認証を分ける:
      #   監査対象: arata.yaml の aws.profile: arata-audit → 実行用ロールから読み取り専用ロールへ連鎖する
      #   ストア:   arata.yaml の store_profile は書かない → SDK の標準の連鎖で実行用ロールのまま書く
      # バケットを別のロールで書くなら、ここに [profile arata-store] (role_arn と credential_source) を足し、
      # store_profile: arata-store と書く。credential_source は role_arn なしでは使えない。
      - id: aws-config
        name: 監査ロールのプロファイルを書く
        env:
          AUDIT_ROLE_ARN: ${{ secrets.ARATA_AUDIT_ROLE_ARN }}
        run: |
          cfg="$RUNNER_TEMP/aws-config"
          umask 077
          cat >"$cfg" <<CONFIG
          [profile arata-audit]
          role_arn = $AUDIT_ROLE_ARN
          credential_source = Environment
          role_session_name = arata-audit
          CONFIG
          echo "AWS_CONFIG_FILE=$cfg" >>"$GITHUB_ENV"

      # ログの方針: 出力は実行環境の一時ファイルに書き、Actions には INFO 以外の level / code / source だけを出す。
      # msg と error には ARN・アカウント ID などが入り得る。Actions のログはリポジトリを読める人に見えるので、
      # 値を ::add-mask:: で列挙して隠すのではなく、そもそも出さない (監査の結果に何が出るかは列挙できない)。
      # 原因を詳しく見るときは手元で同じコマンドを実行する。
      # 時間切れは認証の期限 (1 時間) より短くする。切れたら確定せず、次の run がやり直す。
      - id: audit
        name: arata run
        timeout-minutes: 50
        env:
          # 手動実行の入力。定時の実行では空。値は引数として渡すだけで、妥当かは arata が確かめる
          DRY_RUN: ${{ inputs.dry_run }}
          DRY_RUN_WINDOW: ${{ inputs.window }}
        run: |
          log="$RUNNER_TEMP/arata.log"
          status=0
          args=(run -c "$ARATA_CONFIG_DIR/arata.yaml" --profile "$PROFILE" --out "$RUNNER_TEMP/arata-out")
          if [ "${DRY_RUN:-}" = "true" ]; then
            args+=(--dry-run)
            if [ -n "${DRY_RUN_WINDOW:-}" ]; then
              args+=(--window "$DRY_RUN_WINDOW")
            fi
          fi
          arata "${args[@]}" >"$log" 2>&1 || status=$?
          jq -Rc 'fromjson? | objects | select(.level != "INFO") | {level, code, source}' "$log" || true
          echo "arata exit=$status"
          exit "$status"

      # 試しの実行 (手動実行の dry_run) の結果。通知はしないので、件数と重大度だけをここに出す。
      # ログの方針は上と同じ: 個々の指摘の中身 (主体・IP・要約) と注記の文は出さない。
      # 数と、決まった語彙の値 (重大度) と、時刻の形の値だけを選んで出す。中身を読むときは、手元で同じ arata run --dry-run を流す。
      - id: dry-run-summary
        name: 試しの実行の結果 (件数だけ)
        if: always() && inputs.dry_run
        timeout-minutes: 5
        run: |
          file="$RUNNER_TEMP/arata-out/report.json"
          if [ ! -f "$file" ]; then
            echo "試しの実行の報告がありません (arata run の終了コードと code を見てください)"
            exit 0
          fi
          jq -c '
            def sev: ["critical", "high", "medium", "low"];
            def count: if type == "number" then . else null end;
            def stamp: if type == "string" and test("^[0-9T:Z.+-]{1,40}$") then . else null end;
            {
              dry_run: (.dry_run == true),
              window: {from: (.window.from | stamp), to: (.window.to | stamp)},
              summary: {
                new: (.summary.new | count), changed: (.summary.changed | count), recurred: (.summary.recurred | count),
                resolved: (.summary.resolved | count), still_open: (.summary.still_open | count),
                max_severity: (.summary.max_severity as $s | if (sev | index($s)) then $s else null end)
              },
              by_severity: ([.findings.new[]?, .findings.changed[]?, .findings.recurred[]?]
                | map(.severity as $s | select(sev | index($s)) | $s) | group_by(.) | map({key: .[0], value: length}) | from_entries),
              sources_failed: (.coverage.sources_failed | length),
              checks_skipped: (.coverage.checks_skipped | length),
              notes: (.coverage.notes | length)
            }' "$file" 2>/dev/null || echo "試しの実行の報告を読めませんでした"

      # arata が失敗しても aratam は必ず動かす (バイナリが取れていれば)。
      # 実行環境は毎回消えるので、STORE_CONFLICT・INTERRUPTED・設定の誤り・OIDC の失敗のどれでも report.json が無く、
      # aratam は max_age を待たずに「arata の出力が無いか古い」を緊急用に送る (終了コード 4)。
      # max_age が効くのは --out が残る環境だけなので、ここでは daily と weekly で同じ aratam.yaml を使える。
      # 一部のソースが取れなかったとき (arata の終了コード 3) は report.json があるので、通常の通知が緊急用に届く。
      # どちらもジョブは失敗 (赤) のままにする。
      # Slack への送り方 (bot か webhook) を aratam.yaml から読む。下の notify に、その送り方の secret だけを渡すため。
      # 読むのは `aratam config check --format json` の .slack.method (機械が読む出力)。人向けの出力の行を grep で読まない
      # (文言は版をまたいで変わり、判別が黙って外れる)。bot / webhook 以外なら、ここで止まる (README「Slack への送り方を判別する」)。
      # 判別は .github/scripts/arata-slack-method.sh の 1 か所。試しの送信 (arata-notify-test.yml) と PR の検査 (arata-check.yml) も同じものを呼ぶ。
      - id: slack-method
        name: Slack への送り方を判別する
        if: always() && steps.install.outcome == 'success' && !inputs.dry_run
        timeout-minutes: 2
        run: |
          method="$(.github/scripts/arata-slack-method.sh "$ARATA_CONFIG_DIR/aratam.yaml")"
          echo "slack method=$method"
          echo "method=$method" >>"$GITHUB_OUTPUT"

      - id: notify
        name: aratam notify
        # 試しの実行では通知しない (aratam も dry_run の報告は送らない。ここで呼ばないのは、arata が失敗したときに「実行されていない」を送らないため)
        if: always() && steps.install.outcome == 'success' && !inputs.dry_run
        timeout-minutes: 5
        env:
          # 判別した送り方の secret だけを渡す (使わないほうは空)。Webhook の方式なら上の 2 つ、bot トークンの方式なら下の 1 つ
          # (README の「bot トークンで送る」。チャンネル ID は aratam.yaml に書く。秘密ではない)。
          # 判別に失敗していれば 3 つとも空で、aratam は CONFIG_INVALID (終了コード 2) で止まる。そのことは最後の alert が知らせる。
          ARATAM_SLACK_WEBHOOK: ${{ steps.slack-method.outputs.method == 'webhook' && secrets.ARATAM_SLACK_WEBHOOK || '' }}
          ARATAM_SLACK_URGENT_WEBHOOK: ${{ steps.slack-method.outputs.method == 'webhook' && secrets.ARATAM_SLACK_URGENT_WEBHOOK || '' }}
          ARATAM_SLACK_BOT_TOKEN: ${{ steps.slack-method.outputs.method == 'bot' && secrets.ARATAM_SLACK_BOT_TOKEN || '' }}
        run: |
          log="$RUNNER_TEMP/aratam.log"
          status=0
          aratam notify -c "$ARATA_CONFIG_DIR/aratam.yaml" --in "$RUNNER_TEMP/arata-out" >"$log" 2>&1 || status=$?
          jq -Rc 'fromjson? | objects | select(.level != "INFO") | {level, code, source}' "$log" || true
          echo "aratam exit=$status"
          # Slack に何かが届いた終了コード: 0 = 送った (送る必要が無かった)、3 = LLM が使えず原文で送った、4 = 入力が無い・古いと送った。
          # 2 (設定・secret の誤り) と 5 (送信の失敗) は、何も届いていない。最後の alert はこの印を見る
          case "$status" in
            0 | 3 | 4) echo "delivered=true" >>"$GITHUB_OUTPUT" ;;
          esac
          exit "$status"

      # WAF の提案の全文は --in のディレクトリにしか書かれず、実行環境と一緒に消えるのでストアのバケットに残す。
      # report の本文は arata が reports/<profile>.md として既に置いている。
      # Actions の artifacts はリポジトリを読める人に見えるので使わない。
      - id: save-proposals
        name: WAF の提案の全文をストアへ置く
        if: always() && steps.aws.outcome == 'success' && !inputs.dry_run
        timeout-minutes: 5
        run: |
          file="$RUNNER_TEMP/arata-out/waf-proposals.md"
          if [ -f "$file" ]; then
            aws s3 cp "$file" "$ARATA_STORE_URL/reports/waf-proposals.md" --only-show-errors >/dev/null 2>&1
          fi

      # 定時の実行で、Slack に何も届かなかったときに、別の経路で知らせる (README「定時の通知が送れなかったとき」)。
      # 通知そのものが壊れると (設定の誤り、secret の入れ替え忘れ、送り方の判別の失敗、バイナリが取れない)、aratam は知らせられない。
      # 送るのは「監査対象の名前・プロファイル・失敗した段階の id・この実行の URL」だけ。指摘の中身・件数・ログの文は送らない。
      # 失敗した段階は toJSON(steps) の outcome から拾う (id は、このファイルに書いた名前。値は見ない)。
      # 手動実行 (workflow_dispatch) では送らない (実行した人が結果を見ている)。
      # aratam が「実行されていない」「一部が取れなかった」を Slack に送れたとき (上の delivered) も送らない。
      - id: alert
        name: 定時の通知が送れなかったことを別の経路で知らせる
        if: failure() && github.event_name == 'schedule' && steps.notify.outputs.delivered != 'true'
        timeout-minutes: 3
        env:
          # 定時の通知とは別の Webhook (別のチャンネルか、{"text": "..."} を受け取る別の仕組み)。README の Secrets
          ALERT_WEBHOOK: ${{ secrets.ARATA_ALERT_WEBHOOK }}
          STEPS: ${{ toJSON(steps) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # id は英小文字・数字・ハイフンのものだけを拾う (このファイルの id の形)。outcome のほかの値・outputs は読まない
          failed="$(jq -r '[to_entries[] | select(.value.outcome == "failure") | .key | select(test("^[a-z0-9-]{1,40}$"))] | join(", ")' <<<"$STEPS" 2>/dev/null)" || failed=""
          echo "failed steps: ${failed:-unknown}"
          if [ -z "${ALERT_WEBHOOK:-}" ]; then
            echo "::error::ARATA_ALERT_WEBHOOK が無いので、通知が送れなかったことを知らせられない"
            exit 1
          fi
          text="arata の定時の通知を送れていません。対象: $ARATA_TARGET / プロファイル: $PROFILE / 失敗した段階: ${failed:-不明} / $RUN_URL"
          # URL は秘密なので、curl の出力もエラーも出さない
          if ! jq -n --arg text "$text" '{text: $text}' |
            curl --silent --fail --max-time 20 --retry 2 -H 'Content-Type: application/json' --data-binary @- "$ALERT_WEBHOOK" >/dev/null 2>&1; then
            echo "::error::通知が送れなかったことの連絡も送れなかった"
            exit 1
          fi
