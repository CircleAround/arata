# arata と aratam を GitHub Actions で定期実行する見本 (複数の AWS アカウントを 1 つのリポジトリで監査する形)。
# 1 つのアカウントだけなら arata-audit.yml を使う。違いは matrix と、監査ロールの取り出し方だけ。
# 利用者のリポジトリの .github/workflows/ に写して使う (arata のリポジトリの CI では動かさない)。
# 用意するもの・費用・注意は同じディレクトリの README.md。例の値はすべて架空。
#
# 利用者のリポジトリに置くもの (アカウントごとに 1 つのディレクトリ。名前は matrix の account と同じ):
#   aws/prod/arata.yaml         store: s3://example-arata-store/prod と aws.profile: arata-audit を書く
#   aws/prod/aratam.yaml        name: (通知に出す監査対象の名前) をアカウントごとに変える
#   aws/prod/allowlist.yaml
#   aws/prod/aratam-context.md  (任意。llm.context_file)
#   aws/staging/...             同じ形
name: arata-audit

on:
  schedule:
    # 時刻は UTC。毎時ちょうどは GitHub の定時実行が混み、遅れたり落ちたりするので避ける。
    # daily を UTC 0 時台の後半にするのは、Logs Insights のスキャンの範囲が半分ほどになるため (arata doctor の cost の行の案内)。
    # 「UTC 0 時 + 窓 (24h) + ingest_delay (15m) + 余裕 15 分」= 00:30 より後ならよい。遅れは費用を増やさない。
    - cron: '40 0 * * *'   # daily (JST 09:40)
    - cron: '10 1 * * 1'   # weekly (月曜 JST 10:10)。下の PROFILE の文字列と揃える
  workflow_dispatch:
    inputs:
      profile:
        description: 実行するプロファイル
        type: choice
        options: [daily, weekly]
        default: daily

permissions: {}

defaults:
  run:
    shell: bash     # -eo pipefail で動く

env:
  ARATA_VERSION: v0.5.1        # v0.5.1 以降にする (それより前は、Bedrock の新しいモデルで要約が失敗する)。固定し、上げるときは PR で
  AWS_REGION: ap-northeast-1

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # アカウントごとに 1 つのジョブ。1 つが失敗してもほかは続ける。
    # 名前は小文字の英数字とハイフンだけにする (設定のディレクトリ・ストアの prefix・排他の名前に使う)。
    strategy:
      fail-fast: false
      matrix:
        account: [prod, staging]
    # 同じストアへの同時実行を止める。走っている run は中断しない (中断すると収集を捨てることになる)。
    # 止めきれなくても、後から終わったほうが STORE_CONFLICT で失敗するだけで、ストアは壊れない (ADR 0034)。
    # ストアはアカウントごとなので、group もアカウントごとにする。
    concurrency:
      group: arata-audit-${{ matrix.account }}
      cancel-in-progress: false
    permissions:
      id-token: write   # OIDC で実行用ロールを引き受ける
      contents: read    # 設定ファイルの checkout
    env:
      ACCOUNT: ${{ matrix.account }}
      ARATA_CONFIG_DIR: aws/${{ matrix.account }}
      ARATA_STORE_URL: s3://example-arata-store/${{ matrix.account }}   # aws/<account>/arata.yaml の store: と同じ値
      PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.profile || (github.event.schedule == '10 1 * * 1' && 'weekly' || 'daily') }}
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # バイナリは認証より先に取る。OIDC が失敗しても aratam で「実行されていない」と知らせるため。
      # 照合の SHA256SUMS は同じリリースのものなので、壊れた取得は防げるがリリース自体のすり替えは防げない。
      # 公開リポジトリのリリースなら gh attestation verify で来歴も確かめられる (arata の README「来歴の検証」)。
      - id: install
        name: arata と aratam を取得する
        env:
          # arata のリポジトリは公開なので、Release は github.token で読める (ほかのトークンは要らない)
          GH_TOKEN: ${{ github.token }}
        run: |
          dir="$RUNNER_TEMP/arata-bin"
          mkdir -p "$dir"
          gh release download "$ARATA_VERSION" -R CircleAround/arata -D "$dir" \
            -p arata-linux-amd64 -p aratam-linux-amd64 -p SHA256SUMS
          cd "$dir"
          for name in arata aratam; do
            grep " ${name}-linux-amd64\$" SHA256SUMS | sha256sum --check --strict --quiet -
            install -m 0755 "${name}-linux-amd64" "$name"
          done
          echo "$dir" >>"$GITHUB_PATH"

      # 実行用ロール。権限は監査ロールの引き受けとストアのバケットの読み書きだけにする。
      # ロールの ARN はアカウント ID を含むので secrets に置く (secrets はログで自動的に隠される)。
      - id: aws
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.ARATA_RUNNER_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: arata-audit
          role-duration-seconds: 3600
          mask-aws-account-id: true

      # 2 つの認証を分ける:
      #   監査対象: arata.yaml の aws.profile: arata-audit → 実行用ロールから、そのアカウントの読み取り専用ロールへ連鎖する
      #   ストア:   arata.yaml の store_profile は書かない → SDK の標準の連鎖で実行用ロールのまま書く
      # 監査ロールの ARN は 1 つの secret に JSON でまとめ ({"prod": "arn:...", "staging": "arn:..."})、ここで名前から取り出す。
      # secrets[...] の動的な参照は使わない (ジョブにすべての secrets が渡ってしまう)。
      # 取り出した ARN は secret の一部で、自動では隠れないので ::add-mask:: で隠す。jq の出力とエラーはログに出さない。
      - id: aws-config
        name: 監査ロールのプロファイルを書く
        env:
          AUDIT_ROLE_ARNS: ${{ secrets.ARATA_AUDIT_ROLE_ARNS }}
        run: |
          arn="$(jq -r --arg a "$ACCOUNT" '.[$a] | strings' <<<"$AUDIT_ROLE_ARNS" 2>/dev/null)" || arn=""
          case "$arn" in
            arn:aws*:iam::*:role/*) ;;
            *)
              echo "ARATA_AUDIT_ROLE_ARNS に $ACCOUNT の監査ロールの ARN が無い"
              exit 1
              ;;
          esac
          echo "::add-mask::$arn"
          cfg="$RUNNER_TEMP/aws-config"
          umask 077
          cat >"$cfg" <<CONFIG
          [profile arata-audit]
          role_arn = $arn
          credential_source = Environment
          role_session_name = arata-audit
          CONFIG
          echo "AWS_CONFIG_FILE=$cfg" >>"$GITHUB_ENV"

      # ログの方針: 出力は実行環境の一時ファイルに書き、Actions には INFO 以外の level / code / source だけを出す。
      # msg と error には ARN・アカウント ID などが入り得る。Actions のログはリポジトリを読める人に見えるので、
      # 値を ::add-mask:: で列挙して隠すのではなく、そもそも出さない (監査の結果に何が出るかは列挙できない)。
      # 原因を詳しく見るときは手元で同じコマンドを実行する。
      # 時間切れは認証の期限 (1 時間) より短くする。切れたら確定せず、次の run がやり直す。
      - id: audit
        name: arata run
        timeout-minutes: 50
        run: |
          log="$RUNNER_TEMP/arata.log"
          status=0
          arata run -c "$ARATA_CONFIG_DIR/arata.yaml" --profile "$PROFILE" --out "$RUNNER_TEMP/arata-out" >"$log" 2>&1 || status=$?
          jq -Rc 'fromjson? | objects | select(.level != "INFO") | {level, code, source}' "$log" || true
          echo "arata exit=$status"
          exit "$status"

      # arata が失敗しても aratam は必ず動かす (バイナリが取れていれば)。
      # 実行環境は毎回消えるので、STORE_CONFLICT・INTERRUPTED・設定の誤り・OIDC の失敗のどれでも report.json が無く、
      # aratam は max_age を待たずに「arata の出力が無いか古い」を緊急用に送る (終了コード 4)。
      # max_age が効くのは --out が残る環境だけなので、ここでは daily と weekly で同じ aratam.yaml を使える。
      # 一部のソースが取れなかったとき (arata の終了コード 3) は report.json があるので、通常の通知が緊急用に届く。
      # どちらもジョブは失敗 (赤) のままにする。
      - id: notify
        name: aratam notify
        if: always() && steps.install.outcome == 'success'
        timeout-minutes: 5
        env:
          ARATAM_SLACK_WEBHOOK: ${{ secrets.ARATAM_SLACK_WEBHOOK }}
          ARATAM_SLACK_URGENT_WEBHOOK: ${{ secrets.ARATAM_SLACK_URGENT_WEBHOOK }}
        run: |
          log="$RUNNER_TEMP/aratam.log"
          status=0
          aratam notify -c "$ARATA_CONFIG_DIR/aratam.yaml" --in "$RUNNER_TEMP/arata-out" >"$log" 2>&1 || status=$?
          jq -Rc 'fromjson? | objects | select(.level != "INFO") | {level, code, source}' "$log" || true
          echo "aratam exit=$status"
          exit "$status"

      # WAF の提案の全文は --in のディレクトリにしか書かれず、実行環境と一緒に消えるのでストアのバケットに残す。
      # report の本文は arata が reports/<profile>.md として既に置いている。
      # Actions の artifacts はリポジトリを読める人に見えるので使わない。
      - id: save-proposals
        name: WAF の提案の全文をストアへ置く
        if: always() && steps.aws.outcome == 'success'
        timeout-minutes: 5
        run: |
          file="$RUNNER_TEMP/arata-out/waf-proposals.md"
          if [ -f "$file" ]; then
            aws s3 cp "$file" "$ARATA_STORE_URL/reports/waf-proposals.md" --only-show-errors >/dev/null 2>&1
          fi
