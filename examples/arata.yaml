# arata の設定サンプル (CloudTrail LookupEvents + CloudWatch Logs Insights)。
# 監査対象ごとに 1 ファイル。allowlist.yaml と一緒に git 管理する。
# 全チェック・全パラメータを明示した推奨設定は `arata config init` で書き出せる (この例はそれより短い、アプリ層を含む例)。

name: example

# ストア。Step 1 は dir:// のみ (JSONL 原本 + SQLite)。s3:// は後続 Step。
store: dir:///var/lib/arata/example

# 既知リスト。相対パスはこの設定ファイルからの相対。無ければ空として扱う。
allowlist: allowlist.yaml

aws:
  region: ap-northeast-1
  # profile: example-audit   # AWS SDK の標準認証チェーン (profile / 環境変数 / ロール) に従う

sources:
  - id: trail
    kind: cloudtrail-lookup        # CloudTrail を API 経由で取得 (CloudWatch Logs 配信が無くても動く)
    # regions: [ap-northeast-1, us-east-1]
    # 省略時は [aws.region, us-east-1]。IAM の書き込み・ConsoleLogin・STS の一部は us-east-1 にしか記録されないので、
    # us-east-1 を外すと root_usage / iam_changes がほぼ鳴らなくなる
    # ingest_delay: 15m              # 記録の遅れの見込み。run は窓の前をこの分だけ引き直す (既定 15m、0 で引き直さない)

  # アカウント単位の状態 (週次チェック用)。weekly プロファイルの run でだけ取る
  - id: iam
    kind: iam-credential-report    # iam:GenerateCredentialReport は書き込み系 (生成のみ)。拒否されても 4 時間以内のレポートがあれば使う
  - id: guardduty
    kind: guardduty
    # regions: [ap-northeast-1]    # 既定は aws.region
  - id: access_analyzer
    kind: access-analyzer
  - id: posture
    kind: posture
  - id: waf_config
    kind: waf-config               # WAFv2 の WebACL の設定 → waf_review (提案の候補)。REGIONAL は regions、CLOUDFRONT は us-east-1 を見る
    # regions: [ap-northeast-1]    # 既定は aws.region

  # アプリ層: ロググループ → 形式プロファイル → 正規化レコード (設計書 2 章)。取得は Logs Insights の集計クエリのみ。
  - id: nginx_prod
    kind: cloudwatch-logs
    log_group: prod-nginx-access
    format: nginx_access             # nginx combined 形式 → http_access
    # region: ap-northeast-1         # 既定は aws.region (1 つだけ)
    # max_scan_gb: 5                 # 1 回の収集でスキャンしてよい量。超えたら QUERY_LIMIT (既定 0 = 無制限)
    # ingest_delay: 5m               # 取り込みの遅れの見込み。run は窓の前をこの分だけ引き直す (既定 5m)
  # - id: ecs_web
  #   kind: cloudwatch-logs
  #   log_group: /ecs/my-app-production
  #   stream_prefix: web/            # ストリーム名 (web/web/<task-id>) で絞る。リバースプロキシとアプリのログが同じストリームに混在する
  #   format: nginx_access
  #   expected_match_rate: 0.3       # 混在ストリームは nginx 以外の行も数えるので閾値を下げる (doctor の解釈率を見て決める)
  # - id: waf
  #   kind: cloudwatch-logs
  #   log_group: aws-waf-logs-prod
  #   format: wafv2                  # → waf_action (waf_block_trend、waf_review の日次集計)
  #   strip_path_prefix: /prod       # API Gateway の REST API はパスの前にステージ名が付く。ALB・CloudFront なら書かない
  # - id: rails_app
  #   kind: cloudwatch-logs
  #   log_group: prod-app.log
  #   format: json                   # lograge など JSON 行ログ。どのフィールドが何に当たるかの対応表
  #   fields: { ip: remote_ip, method: method, path: path, status: status }
  #   expected_match_rate: 0.6       # 混在ストリームなど全行が該当しない場合は下げる (既定 0.8)
  #   sample_lines: false            # FORMAT_MISMATCH のログに行の例を添えない (個人情報を含み得るログ)
  # - id: rails_admin
  #   kind: cloudwatch-logs
  #   log_group: prod-app.log
  #   format: regex                  # 名前付きキャプチャ (ip と path は必須) → Insights の parse に変換
  #   regex: 'Started (?P<method>\w+) "(?P<path>/admin/[^"]*)" for (?P<ip>[\d.]+)'

# 周期ごとの窓と有効チェック。実行されるのはここに書いたチェックだけ (arata profiles で確かめる)。
# `default-<cadence>` はその周期のチェック全部に展開される (版が上がって増えたチェックも黙って入る。雛形では使わない)。
# チェック: root_usage (hourly), unknown_assume_role (hourly), new_principal (daily), iam_changes (daily), access_denied (daily),
#           defense_evasion / public_exposure (daily), principal_new_source / secret_access (daily),
#           ai_path_usage (daily), login_bruteforce / probe_paths / endpoint_abuse (daily, http_access), waf_block_trend (daily, waf_action),
#           credential_hygiene / guardduty_findings / posture / access_analyzer / waf_review (weekly)
# hourly に http_access / waf_action を使うチェックを入れなければ hourly では Logs Insights を回さない
profiles:
  hourly:
    window: 1h
    checks: [root_usage, unknown_assume_role]
  daily:
    window: 24h
    # max_catchup: 7d              # cron が遅れた時に前回の窓の終わりから追いつく上限 (既定 7d)
    checks: [default-daily, root_usage, unknown_assume_role]   # daily だけ運用する場合は hourly のチェックも入れる
  weekly:
    window: 7d
    checks: [credential_hygiene, guardduty_findings, posture, access_analyzer, waf_review]   # waf_review は waf_config と wafv2 のソースが要る (無ければ skip)

# アプリ層チェックのパス・閾値 (省略時の既定値)。平常帯 = その IP 自身の直近 baseline_days 日の中央値 × factor (下限 min_count)。
checks:
  login_bruteforce:
    paths: [/users/sign_in, /login, /signin]   # sign-in の送信先 (完全一致、クエリ文字列は除く)
    methods: [POST]
    failure_statuses: [401, 403, 422]          # 失敗とみなすステータス (Devise の再表示は 401 / 422)
    baseline_days: 14
    factor: 3
    min_count: 20
    top_ip_min_count: 5                        # その日の最多 IP が初出なら、この件数以上で報告
    min_baseline_days: 7                       # 「初出」判定に要る過去データの日数
  probe_paths:
    paths: [/.env, /.git/, /.aws/, /wp-login.php, /wp-admin, /xmlrpc.php, /phpmyadmin]   # 機密パスの接頭辞 (既定はもう少し多い)
    exclude_paths: []                          # 正規の管理画面などを外す接頭辞
    statuses: [403, 404]
    min_count: 10
  endpoint_abuse:                              # 画面への多数の IP からの短時間の集中と「A のあと B」の連鎖 (ADR 0030)。endpoints が空なら何もしない
    endpoints:                                 # 見る画面 (集計条件。overrides では変えられない)
      - { name: signup, paths: [/signup], methods: [POST] }
      - { name: message, paths: [/messages, "/messages/*", "/**/messages"], methods: [POST] }   # * は 1 区間、** は 0 区間以上、:id は数字か UUID
    window: 10m                                # 集計の時間幅
    min_distinct_ips: 10                       # 時間幅の異なり IP 数がこれ以上かつふだん (過去の幅の p99) × factor 超えで medium
    min_count: 20                              # 時間幅の件数がこれ以上かつふだん × factor 超えで low
    follow_ups:                                # 登録の直後にメッセージ送信 (連鎖した IP 数が min_ips 以上かつふだん超えで medium)
      - { from: signup, to: message, within: 30m, min_ips: 5 }
  waf_block_trend:
    top_n: 5                                   # BLOCK 件数の Top IP の入れ替わりを見る数
    min_count: 10
    new_rule_min_count: 1
  waf_review:                                  # WAF の修正提案の候補 (weekly。daily が貯めた wafv2 の日次集計を読む。ADR 0023)
    trusted_cidrs: [198.51.100.0/24]           # 監視・開発会社などの正規の送信元 (集計と候補から外す。集計条件)
    expected_high_rate_paths: [/checkout/]     # リクエストが多いのが仕様のパス (レート制限の候補から外す)
    rate_path_groups: [/login, /api/]          # 1 IP あたりの件数を分けて測るパスの群
    min_distinct_ips: 10                       # 誤検知の疑いに要る異なり IP 数 (日ごとの最大)
  access_denied:                               # 拒否された API 呼び出し (主体ごと。平常帯はその主体自身の過去)
    error_codes: [AccessDenied, AccessDeniedException, UnauthorizedOperation, Client.UnauthorizedOperation]
    min_distinct_apis: 5                       # 拒否された API の種類がこれ以上で medium (列挙の兆候)
    high_distinct_apis: 20                     # これ以上で high
    min_count: 50                              # 件数の条件の下限 (medium 止まり)
  defense_evasion:                             # 監査・検知を止める・弱める操作 (ADR 0026)
    min_log_retention_days: 90                 # これより短い保持期間の設定を報告 (監査対象のロググループなら critical)
    trail_buckets: [example-trail-bucket]      # CloudTrail の証跡の宛先バケット (ポリシーの削除・ライフサイクルを報告)
  public_exposure:                             # 外部に開く設定変更 (ADR 0026)
    sensitive_ports: [22, 3389, 3306, 5432, 1433, 1521, 6379, 11211, 27017, 9200, 5601, 2375]   # 0.0.0.0/0 に開けたら high
  principal_new_source:                        # 既知の主体の初めての送信元 (/24・/48)・リージョン (ADR 0027)
    baseline_days: 30                          # 「初めて」とみなすために比べる過去の日数
    min_baseline_days: 15                      # CloudTrail を収集し終えた過去日がこれ未満 (導入直後) は報告しない
    min_writes: 5                              # 新しい送信元からの書き込みがこれ以上で medium
  secret_access:                               # 秘匿値の読み取りの異常 (ADR 0027)
    baseline_days: 14                          # 「主体 × 秘匿値」の初出と一括読み出しの平常帯の日数
    min_baseline_days: 7                       # 初出の判定に要る、収集し終えた過去日数
    factor: 3                                  # 一括読み出しの平常帯の倍率
    min_distinct: 10                           # 1 日に読んだ異なる秘匿値の数がこれを超えたら high

# 保持期間 (省略時の既定値)。prune は後続 Step。
retention:
  raw_jsonl: 365d
  events: 90d
  metrics: 400d
  findings: 180d
  runs: 400d
