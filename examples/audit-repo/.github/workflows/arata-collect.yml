# 取得 (arata collect --incremental) を短い間隔で回し、その前に hourly のプロファイルを判定して、high 以上だけを知らせる (アカウントごとに 1 つのジョブ。matrix。ADR 0078・0082)。
# arata repo init --collect-every が書き出したファイル (ADR 0059・0078)。手で直さない: 間隔を変える・やめるときは、
# README.md のコマンドの --collect-every を直して (やめるなら外して) arata repo init --force を流し、PR の差分で確かめる。
# コメントの「説明書」は、arata のリポジトリの examples/github-actions/README.md。
#
# 取得を先に済ませておくと、毎朝の daily は読み直さずに判定だけに近づき、1 回の収集が max_collect に当たって partial になることも減る。
# 集めるのは、CloudTrail の種類と collect: hourly の cloudwatch-logs のソースだけ (ADR 0064・0065)。日の頭から読み直すソースは daily が読む。
# Slack に送るのは、hourly の判定で重大度の下限 (min_severity) 以上の指摘があったときと、それが届かなかったときだけ。判定・取得の失敗では送らない (説明書「取得の回に high 以上を知らせる」)。
name: arata-collect

on:
  schedule:
    # 時刻は UTC。毎時ちょうどは GitHub の定時実行が混み、遅れたり落ちたりするので避ける。
    # 分は記録の遅れ (CloudTrail の ingest_delay の既定 15 分) より後にする (collect: hourly は、終わった時しか読まない)。
    # */N は 0 時を含むので、daily (00:40) の 15 分前に 1 回入る。
    - cron: '25 * * * *'   # 1h ごと
  # 止まった後に、手で追いつかせる
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash     # -eo pipefail で動く

env:
  ARATA_VERSION: v0.15.0       # この一式を書き出した arata の版。上げるときは、新しい版の arata repo init --force で書き直す
  AWS_REGION: ap-northeast-1

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # 秘密と OIDC は監査と同じ environment で受け取る (説明書「実行するリポジトリと環境を堅くする」の 5)。
    environment: audit
    strategy:
      fail-fast: false
      matrix:
        account: [prod, staging]
    # 監査 (arata-audit.yml) と同じ group にして、同じストアへの書き込みを順番にする (ADR 0078 の 3 節)。
    # 別の group だと、取得と daily が同時にストアへ書き、後から確定した方が STORE_CONFLICT で失敗する (daily なら、その日の判定と通知を失う)。
    # 走っている run は中断しない。待っている run も取り消さない (既定の queue: single だと、取得の待ちが、待っていた daily を取り消す)。
    concurrency:
      group: arata-audit-${{ matrix.account }}
      cancel-in-progress: false
      queue: max
    permissions:
      id-token: write   # OIDC で実行用ロールを引き受ける
      contents: read    # 設定ファイルの checkout
    env:
      ACCOUNT: ${{ matrix.account }}
      ARATA_CONFIG_DIR: aws/${{ matrix.account }}
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 取得と照合は監査と同じ step (テストが一致を固定する)。
      # 照合の SHA256SUMS は同じリリースのものなので、壊れた取得は防げるがリリース自体のすり替えは防げない。
      # 公開リポジトリのリリースなら gh attestation verify で来歴も確かめられる (arata の 説明書「来歴の検証」)。
      - id: install
        name: arata と aratam を取得する
        env:
          # arata のリポジトリは公開なので、Release は github.token で読める (ほかのトークンは要らない)
          GH_TOKEN: ${{ github.token }}
        run: |
          dir="$RUNNER_TEMP/arata-bin"
          mkdir -p "$dir"
          # Release の取得は、一時的な失敗 (公開した直後の release not found など) があるので、5・10・15 秒の間を空けて 4 回まで試す。
          # 照合 (SHA256SUMS) は取得の後に 1 回だけ行うので、再試行で弱めない。途中まで落ちたファイルは --clobber で上書きする
          for attempt in 1 2 3 4; do
            if gh release download "$ARATA_VERSION" -R CircleAround/arata -D "$dir" --clobber \
              -p arata-linux-amd64 -p aratam-linux-amd64 -p SHA256SUMS; then
              break
            fi
            if [ "$attempt" = 4 ]; then
              echo "::error::arata の Release ($ARATA_VERSION) を 4 回とも取得できませんでした"
              exit 1
            fi
            sleep $((attempt * 5))
          done
          cd "$dir"
          for name in arata aratam; do
            grep " ${name}-linux-amd64\$" SHA256SUMS | sha256sum --check --strict --quiet -
            install -m 0755 "${name}-linux-amd64" "$name"
          done
          echo "$dir" >>"$GITHUB_PATH"

      # 認証に使う 2 つの秘密が未登録 (空) なら、ここで秘密の名前を出して止める (ADR 0060)。秘密は、最初は 1 つも登録されていない。
      # 足りない名前と、そのまま打てる登録のコマンドは、手元の arata repo check --github が出す (このリポジトリの README.md の 4)。
      # 渡すのは空かどうかを見るためだけで、値は出さない。Slack のトークンは、通知と知らせの step にだけ渡す。未登録なら aratam が CONFIG_INVALID で止まる。
      - id: secrets
        name: 秘密が登録されていることを確かめる
        timeout-minutes: 2
        env:
          ARATA_RUNNER_ROLE_ARN: ${{ secrets.ARATA_RUNNER_ROLE_ARN }}
          ARATA_AUDIT_ROLE_ARNS: ${{ secrets.ARATA_AUDIT_ROLE_ARNS }}
        run: |
          status=0
          for name in ARATA_RUNNER_ROLE_ARN ARATA_AUDIT_ROLE_ARNS; do
            if [ -z "${!name:-}" ]; then
              echo "::error::秘密 $name が未登録。手元で arata repo check --github を流し、出たコマンドで登録する (README.md の 4)"
              status=1
            fi
          done
          exit "$status"

      # 実行用ロール。権限は監査ロールの引き受けとストアのバケットの読み書きだけにする。
      # ロールの ARN はアカウント ID を含むので secrets に置く (secrets はログで自動的に隠される)。
      - id: aws
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.ARATA_RUNNER_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: arata-audit
          role-duration-seconds: 3600
          mask-aws-account-id: true

      # 2 つの認証を分ける:
      #   監査対象: arata.yaml の aws.profile: arata-audit → 実行用ロールから、そのアカウントの読み取り専用ロールへ連鎖する
      #   ストア:   arata.yaml の store_profile は書かない → SDK の標準の連鎖で実行用ロールのまま書く
      # 監査ロールの ARN は 1 つの secret に JSON でまとめ ({"<アカウント>": "arn:...", ...})、ここで名前から取り出す。
      # secrets[...] の動的な参照は使わない (ジョブにすべての secrets が渡ってしまう)。
      # 取り出した ARN は secret の一部で、自動では隠れないので ::add-mask:: で隠す。jq の出力とエラーはログに出さない。
      - id: aws-config
        name: 監査ロールのプロファイルを書く
        env:
          AUDIT_ROLE_ARNS: ${{ secrets.ARATA_AUDIT_ROLE_ARNS }}
        run: |
          arn="$(jq -r --arg a "$ACCOUNT" '.[$a] | strings' <<<"$AUDIT_ROLE_ARNS" 2>/dev/null)" || arn=""
          case "$arn" in
            arn:aws*:iam::*:role/*) ;;
            *)
              echo "ARATA_AUDIT_ROLE_ARNS に $ACCOUNT の監査ロールの ARN が無い"
              exit 1
              ;;
          esac
          echo "::add-mask::$arn"
          cfg="$RUNNER_TEMP/aws-config"
          umask 077
          cat >"$cfg" <<CONFIG
          [profile arata-audit]
          role_arn = $arn
          credential_source = Environment
          role_session_name = arata-audit
          CONFIG
          echo "AWS_CONFIG_FILE=$cfg" >>"$GITHUB_ENV"

      # 取得の前に、hourly のプロファイルを判定し、重大度の下限 (arata.yaml の profiles.hourly.min_severity。雛形では high) 以上を知らせる (ADR 0082)。
      # 下限より下の指摘は、この回では記録しない (報告済みにしない) ので、次の daily が新規として知らせる。
      # min_severity が書いてあることは、PR の検査 (arata-check.yml の arata repo check --flash) が確かめる。
      # 判定を取得より先にするのは、取得が追いつきで長引いても知らせを遅らせないため (判定は自分の要る CloudTrail の続きだけを読む)。
      # ログの方針は監査と同じ (INFO 以外の level / code / source だけ)。
      # 終了コード 3 (一部のソースが取れなかった) は警告にして、取れた分の指摘を知らせる。取れなかった分は次の回か daily が読む。
      # ほかの失敗では aratam を呼ばない: 判定は確定していない (ストアに書いていない) ので、次の回か daily が報告する。
      # 呼ぶと、report.json が無いので「arata の出力が無いか古い」を毎時に緊急用へ送ってしまう。
      - id: hourly
        name: arata run --profile hourly
        timeout-minutes: 15
        run: |
          log="$RUNNER_TEMP/arata-hourly.log"
          status=0
          arata run -c "$ARATA_CONFIG_DIR/arata.yaml" --profile hourly --out "$RUNNER_TEMP/arata-out" >"$log" 2>&1 || status=$?
          jq -Rc 'fromjson? | objects | select(.level != "INFO") | {level, code, source}' "$log" || true
          echo "arata exit=$status"
          case "$status" in
            0) echo "reported=true" >>"$GITHUB_OUTPUT" ;;
            3)
              echo "reported=true" >>"$GITHUB_OUTPUT"
              echo "::warning::一部のソースが取れませんでした。取れた分で判定し、取れなかった分は次の回か daily が読みます (終了コード 3)"
              exit 0
              ;;
          esac
          exit "$status"

      # aratam は、report.json の min_severity を見て、静かな回は送らない (aratam.yaml の on_quiet に依らない)。
      # 取れなかったソースがあるだけでは送らず、緊急用にもしない (送り先は指摘の重大度だけで決める)。LLM を呼ぶのは送る回だけ。
      # 通知の冒頭に「この回は high 以上だけを見ています」の 1 行が付く。
      - id: notify
        name: aratam notify
        if: always() && steps.hourly.outputs.reported == 'true'
        timeout-minutes: 5
        env:
          # Slack の秘密は bot トークンの 1 つだけ。この step と、下の知らせの step にだけ渡す (arata の step には渡さない。ADR 0082 の 4 節)
          ARATAM_SLACK_BOT_TOKEN: ${{ secrets.ARATAM_SLACK_BOT_TOKEN }}
        run: |
          log="$RUNNER_TEMP/aratam.log"
          status=0
          aratam notify -c "$ARATA_CONFIG_DIR/aratam.yaml" --in "$RUNNER_TEMP/arata-out" >"$log" 2>&1 || status=$?
          jq -Rc 'fromjson? | objects | select(.level != "INFO") | {level, code, source}' "$log" || true
          echo "aratam exit=$status"
          # Slack に何かが届いた終了コード: 0 = 送った (送る必要が無かった)、3 = LLM が使えず原文で送った、4 = 入力が無い・古いと送った。
          # 2 (設定・secret の誤り) と 5 (送信の失敗) は、何も届いていない。最後の alert はこの印を見る
          case "$status" in
            0 | 3 | 4) echo "delivered=true" >>"$GITHUB_OUTPUT" ;;
          esac
          exit "$status"

      # ログの方針は監査と同じ: 出力は実行環境の一時ファイルに書き、Actions には INFO 以外の level / code / source だけを出す。
      # 時間切れは認証の期限 (1 時間) より短くする。切れたら確定せず、次の回が続きから集める。
      # 終了コード 3 (一部のソースが取れなかった、または 1 回の上限 max_collect に当たった) は警告にして、ジョブを成功にする。
      # 追いつきの途中では毎回 max_collect に当たり、次の回が続きから集める。赤にすると追いつきの間ずっと赤になり、本当の失敗が埋もれる。
      # 取れないソースが続けば、daily がそのソースを自分で読み、取れなければ daily の coverage と通知に出る。
      - id: collect
        name: arata collect --incremental
        # 判定・通知が失敗しても、取得は止めない (それぞれ自分の分を確定する。ADR 0082 の 6 節)
        if: always() && steps.aws-config.outcome == 'success'
        timeout-minutes: 35
        run: |
          log="$RUNNER_TEMP/arata.log"
          status=0
          arata collect --incremental -c "$ARATA_CONFIG_DIR/arata.yaml" >"$log" 2>&1 || status=$?
          jq -Rc 'fromjson? | objects | select(.level != "INFO") | {level, code, source}' "$log" || true
          echo "arata exit=$status"
          if [ "$status" = 3 ]; then
            echo "::warning::一部のソースが取れなかったか、1 回の上限 (max_collect) に当たりました。続きは次の回が集めます (終了コード 3)"
            exit 0
          fi
          exit "$status"

      # 1 時間ごとの判定で知らせるべき指摘があったのに、通知が届かなかったときに、知らせのチャンネルへ 1 行を送る (ADR 0082 の 6 節)。
      # その指摘は arata が報告済みにしているので、daily では「本日報告済み」に回るだけになる。だから知らせる。
      # 判定・取得の失敗では送らない (確定していないので、次の回か daily が報告する。毎時の一時的な失敗で鳴らさない)。
      # 静かな回の通知の失敗 (設定の誤りなど) でも送らない。数は report.json の summary を数として読む (機械が読む値)。
      # 送るのは「監査対象の名前・プロファイル・この実行の URL」だけ。指摘の中身・件数・ログの文は送らない。手動実行 (workflow_dispatch) では送らない。
      - id: alert
        name: 1 時間ごとの通知が送れなかったことを知らせる
        if: failure() && github.event_name == 'schedule' && steps.notify.outcome == 'failure' && steps.notify.outputs.delivered != 'true'
        timeout-minutes: 3
        env:
          SLACK_BOT_TOKEN: ${{ secrets.ARATAM_SLACK_BOT_TOKEN }}
          ALERT_CHANNEL: C0123456782   # 知らせのチャンネル ID (arata repo init --alert-channel)
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          file="$RUNNER_TEMP/arata-out/report.json"
          n="$(jq -r '[.summary.new, .summary.changed, .summary.recurred] | map(if type == "number" then . else 0 end) | add' "$file" 2>/dev/null)" || n=0
          case "$n" in
            '' | *[!0-9]*) n=0 ;;
          esac
          if [ "$n" = 0 ]; then
            echo "この回に知らせるべき指摘は無かったので、知らせません"
            exit 0
          fi
          text="arata の 1 時間ごとの通知を送れていません (知らせるべき指摘があります)。対象: $ACCOUNT / プロファイル: hourly / $RUN_URL"
          # ここから下は、arata-audit.yml の alert と arata-notify-test.yml の alert で同じ (同じ送り方で確かめて、初めて確認になる)。
          # トークンは秘密なので、ヘッダーは標準入力で渡し (引数に書かない)、curl の出力もエラーも出さない。前後の空白 (secret の末尾の改行) は除く。
          token="$(printf '%s' "${SLACK_BOT_TOKEN:-}" | tr -d '[:space:]')"
          if [ -z "$token" ]; then
            echo "::error::ARATAM_SLACK_BOT_TOKEN が未登録なので、知らせを送れない (手元で arata repo check --github)"
            exit 1
          fi
          body="$RUNNER_TEMP/arata-alert.json"
          jq -n --arg channel "$ALERT_CHANNEL" --arg text "$text" '{channel: $channel, text: $text, unfurl_links: false, unfurl_media: false}' >"$body"
          resp="$(printf 'Authorization: Bearer %s\n' "$token" |
            curl --silent --fail --max-time 20 --retry 2 -H @- -H 'Content-Type: application/json; charset=utf-8' \
              --data-binary "@$body" https://slack.com/api/chat.postMessage 2>/dev/null)" || resp=""
          # Slack は失敗でも HTTP 200 を返す。応答の ok が true のときだけ、届いたとみなす
          if [ "$(jq -r '.ok == true' <<<"$resp" 2>/dev/null)" != true ]; then
            # error は、決まった形 (英小文字・数字・_) のときだけ出す (not_in_channel = bot を知らせのチャンネルに招待する、など)。応答の本文は出さない
            err="$(jq -r '.error | strings | select(test("^[a-z0-9_]{1,64}$"))' <<<"$resp" 2>/dev/null)" || err=""
            echo "::error::知らせを送れなかった (slack error=${err:-unknown})"
            exit 1
          fi
