# 静的解析の設定 (ADR 0037)。`make lint` と .github/workflows/sast.yml が同じものを使う。
# 誤検知の抑制は理由を必ず残す。ここでは規則ごとに理由を書き、1 か所だけの抑制はコードの `#nosec <規則> -- <理由>` に書く。
version: "2"

run:
  tests: true

linters:
  default: none
  enable:
    - gosec
    - staticcheck
    - govet
    - ineffassign
    - unused
  settings:
    gosec:
      # G304 (変数のパスを開く) は除く: arata / aratam は利用者が自分の権限で動かす CLI で、パスは利用者の引数と設定から来る。
      # 権限の境界が無いので全箇所が誤検知になる。ログ由来の値がパスに混ざらないことは、source の id・profile 名の検証と
      # S3 のキーの検査で別に担保する (ADR 0037)
      # G104 (エラーの未処理) は除く: 残るのは失敗の経路の後片付け (一時ファイルの削除・Close) だけで、元のエラーを返している。安全性の検査ではない
      excludes:
        - G104
        - G304
      config:
        # 出力の権限の方針は「ファイル 0640・ディレクトリ 0750」(aratam が別のユーザーで動く運用のためグループには読ませる)。これより緩いものは落とす
        G301: "0750"
        G302: "0640"
        G306: "0640"
    staticcheck:
      # 書き方の提案 (QF) と文書の書式 (ST1000 など) は安全性に関係しないので見ない。バグの検出 (SA) と非推奨の検出は全部見る
      checks:
        - all
        - -QF*
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
  exclusions:
    rules:
      # テストの固定値と一時ファイルは攻撃面ではない (権限・パス・偽の実行ファイルの起動を試験のために行う)
      - path: _test\.go
        linters:
          - gosec
      # 偽の AWS と試験用の補助 (本体のバイナリには入らない)。S3 の ETag の再現に MD5 を使い、表名を連結する
      - path: internal/.*test/
        linters:
          - gosec

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
