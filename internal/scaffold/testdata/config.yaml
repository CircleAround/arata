# arata の設定 (arata config init が書き出した雛形)。監査対象ごとに 1 ファイル。allowlist.yaml と一緒に git 管理する。
#
# arata は実行時に暗黙の既定を持たない: 実行されるのは profiles に書いたチェックだけ。
# 新しい版で増えたチェックや変わった既定値は arata config init --diff -c <この設定> で、
# 実際に効いているチェックとパラメータは arata profiles -c <この設定> で確かめる。
# 手順: arata config init → (この設定を編集) → arata doctor → arata init → arata run

name: my-service                                 # レポートに出す監査対象の名前
store: dir:///var/lib/arata/my-service           # ストア (JSONL 原本 + SQLite)。書き込める場所にする
allowlist: allowlist.yaml                        # 既知リスト。相対パスはこの設定ファイルから。無ければ空として扱う

aws:
  region: ap-northeast-1
  # profile: my-service-audit                    # AWS SDK の標準認証チェーン (profile / 環境変数 / ロール) に従う

sources:
  - id: trail
    kind: cloudtrail-lookup                      # CloudTrail を API 経由で取得 (CloudWatch Logs 配信が無くても動く)
    # regions: [ap-northeast-1, us-east-1]       # 省略時は [aws.region, us-east-1]。IAM・ConsoleLogin・STS の一部は us-east-1 にしか記録されない
    # ingest_delay: 15m                          # 記録の遅れの見込み。run は窓の前をこの分だけ引き直す (0 で引き直さない)

  # アカウント単位の状態 (週次チェック用)。取るたびに丸ごと置き換える。プロファイルが必要とする run (weekly) でだけ取る。
  # 一部の権限が無ければ、そのソースのチェックだけ skip される (coverage と doctor に不足 action が出る)。
  - id: iam
    kind: iam-credential-report                  # 認証情報レポート → credential_hygiene
    # iam:GenerateCredentialReport は書き込み系 (レポートの生成のみ)。拒否されても 4 時間以内に生成済みのレポートがあれば使う
  - id: guardduty
    kind: guardduty                              # → guardduty_findings。無効なら skip (無効であることは posture が報告)
    # regions: [ap-northeast-1]                  # 省略時は aws.region。使っているリージョンを並べる
  - id: access_analyzer
    kind: access-analyzer                        # → access_analyzer。アナライザーが無ければ skip
  - id: posture
    kind: posture                                # → posture (CloudTrail・GuardDuty・ルート MFA・S3・パスワードポリシー)
  # - id: waf_config
  #   kind: waf-config                           # WebACL の設定 → waf_review (下の wafv2 のソースも要る)。REGIONAL は regions、CLOUDFRONT は us-east-1

  # アプリ層 (CloudWatch Logs): ロググループ → 形式プロファイル → 正規化レコード。取得は Logs Insights の集計クエリだけ。
  # 足したら arata doctor で解釈率とクエリを確かめる。
  # - id: nginx_prod
  #   kind: cloudwatch-logs
  #   log_group: /my-app/nginx/access.log
  #   format: nginx_access                       # nginx_access / alb_access → http_access、wafv2 → waf_action
  #   # stream_prefix: web/                      # 混在ストリームはストリーム名で絞る
  #   # expected_match_rate: 0.8                 # 解釈率の閾値。混在ストリームは下げる
  #   # max_scan_gb: 5                           # 1 回の収集でスキャンしてよい量 (既定 0 = 無制限)
  #   # ingest_delay: 5m                         # 取り込みの遅れの見込み
  # - id: rails_app
  #   kind: cloudwatch-logs
  #   log_group: /my-app/rails
  #   format: json                               # JSON 行ログ。対応表 (ip と path は必須)
  #   fields: { ip: remote_ip, method: method, path: path, status: status }
  #   # sample_lines: false                      # FORMAT_MISMATCH のログに行の例を添えない (個人情報を含み得るログ)
  # - id: waf
  #   kind: cloudwatch-logs
  #   log_group: aws-waf-logs-my-app
  #   format: wafv2
  #   # strip_path_prefix: /prod                 # API Gateway の REST API はパスの前にステージ名が付く。探索パス・パスの群の判定の前に外す

# チェック一覧 (周期 / 型 / 必要なレコード)。event 型は窓内の出来事、state 型は今の状態を報告する。
#   root_usage           hourly  event  trail_event     ルートユーザーの利用 (critical)
#   unknown_assume_role  hourly  event  trail_event     allowlist に無い呼び出し元の AssumeRole (high)
#   new_principal        daily   state  principal_seen  allowlist にもベースラインにも無い主体 (medium)
#   iam_changes          daily   event  trail_event     IAM の変更。deploy タグの主体なら info (medium)
#   access_denied        daily   event  trail_event     拒否された API 呼び出しの急増。種類が多ければ権限の列挙の兆候 (medium / high)
#   login_bruteforce     daily   event  http_access     sign-in 失敗の IP 別件数が平常帯超え (medium)
#   probe_paths          daily   event  http_access     機密パス探索の 403/404 が平常帯超え (low)
#   waf_block_trend      daily   event  waf_action      WAF の新しく鳴り始めたルール・Top IP の入れ替わり (low)
#   ai_path_usage        daily   event  principal_seen  allowlist で tags: [ai] の主体の利用を主体 × 送信元 IP で毎回 1 行 (info。自己監査)
#   credential_hygiene   weekly  state  iam_credential_report  未使用のアクセスキー・MFA 無しのコンソールユーザー・ルートのアクセスキー (medium / high)
#   guardduty_findings   weekly  state  guardduty       GuardDuty の findings。新規と件数の増加 (重大度は GuardDuty 準拠)
#   posture              weekly  state  posture_item    CloudTrail 証跡と検証・GuardDuty 有効・ルート MFA・S3 Public Access Block・パスワードポリシー (high / medium)
#   access_analyzer      weekly  state  access_analyzer  IAM Access Analyzer の外部アクセス findings (公開は high、他は medium)
#   waf_review           weekly  state  waf_config      WAF の修正提案の候補を report.json の proposals に (正規の画面での大量 BLOCK は low の finding にも)
# 必要なレコードを出すソースが無いチェックは skip される (coverage に理由が出る)。http_access / waf_action は cloudwatch-logs が出す。
profiles:
  hourly:                                        # 発生そのものが異常な事象の早期検知。Logs Insights を使うチェックは入れない (費用)
    window: 1h
    # max_catchup: 7d                            # cron が遅れた時に前回の窓の終わりから追いつく上限
    checks:
      - root_usage           # ルートユーザーの利用 (critical)
      - unknown_assume_role  # allowlist に無い呼び出し元の AssumeRole (high)
  daily:                                         # 前兆・試行の発見と平常帯との比較。hourly を回さない運用でも拾えるよう hourly のチェックも入れる
    window: 24h
    # max_catchup: 7d                            # cron が遅れた時に前回の窓の終わりから追いつく上限
    checks:
      - root_usage           # ルートユーザーの利用 (critical)
      - unknown_assume_role  # allowlist に無い呼び出し元の AssumeRole (high)
      - new_principal        # allowlist にもベースラインにも無い主体 (medium)
      - iam_changes          # IAM の変更。deploy タグの主体なら info (medium)
      - access_denied        # 拒否された API 呼び出しの急増。種類が多ければ権限の列挙の兆候 (medium / high)
      - login_bruteforce     # sign-in 失敗の IP 別件数が平常帯超え (medium)
      - probe_paths          # 機密パス探索の 403/404 が平常帯超え (low)
      - waf_block_trend      # WAF の新しく鳴り始めたルール・Top IP の入れ替わり (low)
      - ai_path_usage        # allowlist で tags: [ai] の主体の利用を主体 × 送信元 IP で毎回 1 行 (info。自己監査)
    # overrides:                                 # このプロファイルでだけ判定のパラメータを変える (書かなければ checks: の値)
    #   login_bruteforce: { min_count: 50 }      # 集計条件 (paths / methods / statuses など) は変えられない
  weekly:                                        # 設定不備・衛生状態の差分
    window: 7d
    # max_catchup: 7d                            # cron が遅れた時に前回の窓の終わりから追いつく上限
    checks:
      - credential_hygiene   # 未使用のアクセスキー・MFA 無しのコンソールユーザー・ルートのアクセスキー (medium / high)
      - guardduty_findings   # GuardDuty の findings。新規と件数の増加 (重大度は GuardDuty 準拠)
      - posture              # CloudTrail 証跡と検証・GuardDuty 有効・ルート MFA・S3 Public Access Block・パスワードポリシー (high / medium)
      - access_analyzer      # IAM Access Analyzer の外部アクセス findings (公開は high、他は medium)
      - waf_review           # WAF の修正提案の候補を report.json の proposals に (正規の画面での大量 BLOCK は low の finding にも)

# チェックのパラメータ (すべてのプロファイルに効く)。下の値はこの版の既定値。
checks:
  login_bruteforce:
    paths: [/users/sign_in, /login, /signin]     # sign-in の送信先。前方一致ではなく完全一致 (クエリ文字列は除いて比べる)。Devise のスコープ付きパス (/admin/users/sign_in など) は実際のパスに合わせる。集計条件なので overrides では変えられない
    methods: [POST]                              # sign-in 試行とみなす HTTP メソッド
    failure_statuses: [401, 403, 422]            # 失敗とみなすステータス (Devise の再表示は 401 / 422、成功は 302 / 303)
    baseline_days: 14                            # 平常帯 = その IP 自身の直近 baseline_days 日の中央値 × factor
    factor: 3                                    # 平常帯の倍率
    min_count: 20                                # 平常帯の下限 (中央値 0 の IP もこの件数までは鳴らさない)
    min_baseline_days: 7                         # 「初出」判定に要る、データのある過去日数 (導入直後に全部が初出になるのを防ぐ)
    top_ip_min_count: 5                          # その日の最多 IP が初出なら、この件数以上で報告
  probe_paths:
    paths: [/.env, /.git/, /.aws/, /.ssh/, /wp-login.php, /wp-admin, /xmlrpc.php, /phpmyadmin, /pma, /server-status, /actuator, /config.json, /backup, /.DS_Store] # 機密パスの接頭辞。集計条件なので overrides では変えられない
    exclude_paths: []                            # 対象から外す接頭辞 (正規の管理画面など)
    statuses: [403, 404]                         # 探索とみなすステータス
    baseline_days: 14                            # 平常帯の日数
    factor: 3                                    # 平常帯の倍率
    min_count: 10                                # 平常帯の下限
    min_baseline_days: 7                         # 「初出」判定に要る過去日数
    top_ip_min_count: 5                          # その日の最多 IP が初出なら、この件数以上で報告
  waf_block_trend:
    top_n: 5                                     # BLOCK 件数の Top IP の入れ替わりを見る数
    min_count: 10                                # Top IP の新顔として報告する BLOCK 件数の下限
    new_rule_min_count: 1                        # 新しく鳴り始めたルールとして報告する BLOCK 件数の下限
    baseline_days: 14                            # 過去と比べる日数
    min_baseline_days: 7                         # 「初出」判定に要る過去日数
  waf_review:
    top_paths: 50                                # wafv2 の BLOCK / 許可された探索のパスを日ごとに残す数 (件数の多い順)。集計条件なので overrides では変えられない
    rate_path_groups: [/login, /api/]            # 1 IP あたりの件数を分けて測るパスの接頭辞 (どれにも当たらなければ「その他」)。集計条件
    trusted_cidrs: []                            # 監視・開発会社などの正規の送信元 (例 [203.0.113.0/24])。wafv2 の新しい集計と候補から外す。集計条件
    expected_high_rate_paths: []                 # リクエストが多いのが仕様のパスの接頭辞 (決済など)。レート制限の候補から外す (observation には残る)
    days: 7                                      # 候補を作るのに見る直近の日数 (daily が貯めた日次集計を読む。weekly は wafv2 を引かない)
    min_distinct_ips: 10                         # 誤検知の疑いに要る異なり IP 数 (日ごとの最大。下限の見積もり)
    finding_distinct_ips: 50                     # 誤検知の疑いを low の finding にもする異なり IP 数
    count_days: 14                               # BLOCK に上げてよいカウントルールに要る、一致が続いた日数
    count_ratio: 0.95                            # その一致のうち探索パスか BLOCK された IP からの割合の下限
    count_min_matches: 100                       # count_days の間の一致の合計の下限
    min_count: 10                                # すり抜けている探索の件数の下限。誤検知の observation (異なり IP が足りない) の件数の下限にも使う
    rate_factor: 10                              # レート制限が無いとみなす条件: 1 IP の 5 分あたりの最大が p99 のこの倍を超える
    rate_margin: 3                               # 提案する limit = max(p99 × rate_margin, rate_floor) (5 分あたり)
    rate_floor: 100                              # 提案する limit の下限
    rate_loose_factor: 10                        # 既存のレート制限が観測の最大のこの倍より高ければ緩すぎる (p99 より低ければ厳しすぎる)
    unused_days: 30                              # 使われていないルールとみなす一致 0 の日数 (この日数分のデータが要る)
    max_proposals: 20                            # 候補の種類ごとに出す上限 (根拠の強い順)
  access_denied:
    error_codes: [AccessDenied, AccessDeniedException, UnauthorizedOperation, Client.UnauthorizedOperation] # 拒否とみなす CloudTrail の errorCode (完全一致)。events に残す条件なので overrides では変えられない。後から足したコードは過去分が無いので平常帯 0 から始まる
    min_distinct_apis: 5                         # 拒否された API の種類がこれ以上 (かつ平常帯超え) で報告 (medium)
    high_distinct_apis: 20                       # 種類がこれ以上なら high (列挙ツールは数十種類を叩く)
    baseline_days: 14                            # 平常帯 = その主体自身の直近 baseline_days 日の中央値 × factor (件数・種類それぞれ)
    factor: 3                                    # 平常帯の倍率
    min_count: 50                                # 件数の条件の下限 (同じ API を叩き続ける設定ミスなど。medium 止まり)
    min_baseline_days: 7                         # 平常帯を使うのに要る、拒否のある過去日数 (それ未満は平常帯 0 として絶対の閾値だけで判定)
  credential_hygiene:
    unused_days: 90                              # アクセスキーを未使用とみなす日数 (最終使用、使われていなければ作成・ローテーションから)
  posture:
    min_password_length: 14                      # IAM パスワードポリシーの最小文字数の下限

# 保持期間 (prune は後続の版)。
retention:
  raw_jsonl: 365d                                # 原本
  events: 90d
  metrics: 400d                                  # 前年同月比較のため 13 か月
  findings: 180d                                 # resolved から
  runs: 400d
