# finding の ack / snooze / resolve を Actions の画面から行う (workflow_dispatch)。
# ストアが S3 にあり、手元にストアを書ける認証を持たない運用で使う。
# arata repo init が書き出したファイル (ADR 0059・0060)。手で直さない: 版を上げる・アカウントを足すときは、
# 同じ引数で arata repo init --force を流して書き直し、PR の差分で確かめる (このリポジトリの README.md)。
# コメントの「説明書」は、arata のリポジトリの examples/github-actions/README.md。
# 使い方・注意は説明書の「finding を片付ける」。
#
# approve はここに入れない。arata approve は allowlist.yaml への追記と同時にストアの finding も resolved にするので、
# 追記の PR をマージする前に finding が消えてしまう。approve は allowlist.yaml を PR で直す (説明書)。
name: arata-triage
run-name: arata-triage ${{ inputs.action }} ${{ inputs.finding_id }} (${{ inputs.account }})

on:
  workflow_dispatch:
    inputs:
      account:
        description: アカウント (aws/ の下のディレクトリの名前)
        type: choice
        options: [@@ACCOUNTS@@]   # arata-audit.yml の matrix.account と同じ並び
        required: true
      action:
        description: 'ack = 再報告しない (未対応の一覧には残る) / snooze = 期日まで沈黙 / resolve = 対応済み (再び観測されたら new)'
        type: choice
        options: [ack, snooze, resolve]
        required: true
      finding_id:
        description: finding の ID (Slack の通知か arata review に出る 12 桁の 16 進)。複数なら空白かカンマで区切る (100 件まで。全部に同じ action・reason を当て、1 件でも通らなければ何も変えない)
        type: string
        required: true
      reason:
        description: 理由 (1 行。ストアとこの実行の Summary に残り、review と報告に出る。ARN・アカウント ID などは書かない)
        type: string
        required: true
      until:
        description: snooze の期日 (YYYY-MM-DD。その日の 0 時 UTC まで沈黙)。snooze のときだけ書く
        type: string
        required: false
      force:
        description: 'ack だけ。片付けの表が ack を許さない finding (high・critical など) も ack する (ふつうは止まる。approve / snooze / resolve を先に考える。理由と実行した人が force として残る)'
        type: boolean
        default: false
        required: false
      dry_run:
        description: '試し。検査 (ID・期日・片付けの表) だけ行い、何をどう変えるかを Summary に出す。ストアは変えない'
        type: boolean
        default: false
        required: false

permissions: {}

defaults:
  run:
    shell: bash     # -eo pipefail で動く

env:
  ARATA_VERSION: @@ARATA_VERSION@@       # arata-audit.yml と同じ版 (PR の検査 arata-check.yml が揃っていることを確かめる)
  AWS_REGION: @@AWS_REGION@@

jobs:
  triage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # 秘密は environment の secrets に置き、environment のデプロイできるブランチを main だけにする (説明書「実行するリポジトリと環境を堅くする」の 5)。
    # ほかのブランチのジョブには秘密が渡らない。OIDC の sub は repo:…:environment:audit になる (runner.yaml の GitHubEnvironment=audit と組)。
    environment: audit
    # 定時の監査 (arata-audit.yml) と同じ group にして、同じストアへは順番に書く。
    # 監査が走っていれば終わるまで待つ。走っている run は中断しない。待っている run も取り消さない (queue: max)。
    # 止めきれなくても、後から終わったほうが STORE_CONFLICT で失敗するだけで、ストアは壊れない (ADR 0034)。
    concurrency:
      group: arata-audit-${{ inputs.account }}
      cancel-in-progress: false
      # 監査と同じく、待っているものを取り消さずに順に待つ (既定の queue: single だと、待っていた定時の監査を取り消す。ADR 0068 の 7 節)
      queue: max
    permissions:
      id-token: write   # OIDC で実行用ロールを引き受ける
      contents: read    # 設定ファイルの checkout
    env:
      ACCOUNT: ${{ inputs.account }}
      ARATA_CONFIG_DIR: aws/${{ inputs.account }}
      # inputs は run に埋め込まず、env で渡す (式の埋め込みはスクリプトの注入になる)
      ACTION: ${{ inputs.action }}
      FINDING_ID: ${{ inputs.finding_id }}
      REASON: ${{ inputs.reason }}
      UNTIL: ${{ inputs.until }}
      FORCE: ${{ inputs.force }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      # 入力の形は認証より先に確かめる。API からの実行は画面の選択肢を通らないので、choice の値も確かめる。
      # finding の ID は arata が振る 12 桁の 16 進。形を決めておけば、引数がフラグとして読まれることも無い。
      # ID は 1〜100 件。空白 (スペース・タブ・改行) かカンマで区切る (arata の ID の並びの規則と同じ。ADR 0080)。
      # 100 件は arata の上限と同じ: 日次の片付けの実例 (42 件) の 2 倍を超え、Summary で ID ごとの中身を人が確かめられる量。
      # 分けた並び (確かめた ID だけ) を出力 ids に書き、後の step はそれを使う (入力を分け直さない)。
      - id: validate
        name: 入力を確かめる
        run: |
          fail() {
            echo "::error::$1"
            exit 1
          }
          [[ "$ACCOUNT" =~ ^[a-z0-9][a-z0-9-]*$ ]] || fail "account は小文字の英数字とハイフン"
          read -r -d '' -a ids <<<"${FINDING_ID//,/ }" || true
          [ "${#ids[@]}" -ge 1 ] || fail "finding_id が空 (Slack の通知か arata review の ID。複数なら空白かカンマで区切る)"
          [ "${#ids[@]}" -le 100 ] || fail "finding_id が ${#ids[@]} 件。1 回に 100 件まで (分けて実行する)"
          # 通らない値は位置だけを出す (値そのものはログに写さない)。重複は確かめた形の ID なので出してよい
          declare -A seen=()
          bad=()
          for i in "${!ids[@]}"; do
            id=${ids[$i]}
            if [[ ! "$id" =~ ^[0-9a-f]{12}$ ]]; then
              bad+=("$((i + 1)) 番目が 12 桁の 16 進ではない")
            elif [ -n "${seen[$id]:-}" ]; then
              bad+=("$id が 2 回")
            fi
            seen[$id]=1
          done
          if [ "${#bad[@]}" -gt 0 ]; then
            msg=$(printf '%s、' "${bad[@]}")
            fail "finding_id: ${msg%、} (Slack の通知か arata review の ID。何も変えていない)"
          fi
          case "$ACTION" in
            ack | resolve)
              [ -z "$UNTIL" ] || fail "until は snooze のときだけ書く"
              ;;
            snooze)
              [[ "$UNTIL" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || fail "snooze には until (YYYY-MM-DD) が要る"
              ;;
            *)
              fail "action は ack / snooze / resolve"
              ;;
          esac
          # API からの実行では boolean の入力が空で届くことがある (false と同じに扱う)
          case "$FORCE" in
            true)
              [ "$ACTION" = ack ] || fail "force は ack のときだけ"
              ;;
            false | "") ;;
            *)
              fail "force は true / false"
              ;;
          esac
          case "$DRY_RUN" in
            true | false | "") ;;
            *)
              fail "dry_run は true / false"
              ;;
          esac
          [[ "$REASON" =~ [^[:space:]] ]] || fail "reason が空"
          if [[ "$REASON" == *$'\n'* || "$REASON" == *$'\r'* || ${#REASON} -gt 300 ]]; then
            fail "reason は 1 行、300 文字まで"
          fi
          # 操作した人は arata の --by の形 (英数字と . _ -)。bot (名前に [bot]) からの実行は受け付けない
          [[ "$GITHUB_ACTOR" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]] || fail "実行した人 ($GITHUB_ACTOR) が arata の --by の形ではない (人が画面から実行する)"
          echo "ids=${ids[*]}" >>"$GITHUB_OUTPUT"

      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 照合の SHA256SUMS は同じリリースのものなので、壊れた取得は防げるがリリース自体のすり替えは防げない。
      # 公開リポジトリのリリースなら gh attestation verify で来歴も確かめられる (arata の 説明書「来歴の検証」)。
      - id: install
        name: arata と aratam を取得する
        env:
          # arata のリポジトリは公開なので、Release は github.token で読める (ほかのトークンは要らない)
          GH_TOKEN: ${{ github.token }}
        run: |
          dir="$RUNNER_TEMP/arata-bin"
          mkdir -p "$dir"
          # Release の取得は、一時的な失敗 (公開した直後の release not found など) があるので、5・10・15 秒の間を空けて 4 回まで試す。
          # 照合 (SHA256SUMS) は取得の後に 1 回だけ行うので、再試行で弱めない。途中まで落ちたファイルは --clobber で上書きする
          for attempt in 1 2 3 4; do
            if gh release download "$ARATA_VERSION" -R CircleAround/arata -D "$dir" --clobber \
              -p arata-linux-amd64 -p aratam-linux-amd64 -p SHA256SUMS; then
              break
            fi
            if [ "$attempt" = 4 ]; then
              echo "::error::arata の Release ($ARATA_VERSION) を 4 回とも取得できませんでした"
              exit 1
            fi
            sleep $((attempt * 5))
          done
          cd "$dir"
          for name in arata aratam; do
            grep " ${name}-linux-amd64\$" SHA256SUMS | sha256sum --check --strict --quiet -
            install -m 0755 "${name}-linux-amd64" "$name"
          done
          echo "$dir" >>"$GITHUB_PATH"

      # 実行用ロールの秘密が未登録 (空) なら、ここで秘密の名前を出して止める (監査と同じ。ADR 0060)。値は出さない。
      - id: secrets
        name: 秘密が登録されていることを確かめる
        timeout-minutes: 2
        env:
          ARATA_RUNNER_ROLE_ARN: ${{ secrets.ARATA_RUNNER_ROLE_ARN }}
        run: |
          if [ -z "${ARATA_RUNNER_ROLE_ARN:-}" ]; then
            echo "::error::秘密 ARATA_RUNNER_ROLE_ARN が未登録。手元で arata repo check --github を流し、出たコマンドで登録する (README.md の 4)"
            exit 1
          fi

      # 実行用ロール (監査と同じ step)。信頼は 1 つのブランチだけなので、このワークフローは main で動かす (説明書)。
      # ack / snooze / resolve が触るのはストアだけで、監査対象のアカウントには問い合わせない。
      # ストアは標準の連鎖 (実行用ロール) で書くので、監査ロールのプロファイル (arata-audit) は書かなくてよい。
      - id: aws
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.ARATA_RUNNER_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: arata-audit
          role-duration-seconds: 3600
          mask-aws-account-id: true

      # ログの方針は監査と同じ: 出力は実行環境の一時ファイルに書き、Actions には INFO 以外の level / code / source だけを出す。
      # 指摘の中身を、操作の前にストアから引いて Summary に出す (ID の取り違えに気づけるように。ADR 0068 の 8 節)。
      # 引くのは機械が読む出力 (review --format json)。中身はログに出さず、実行環境の一時ファイルにだけ置く (ログの方針は監査と同じ)。
      # 引けなくても片付けは止めない (Summary に「引けなかった」と出る)。
      - id: finding
        name: 指摘の中身を引く
        timeout-minutes: 10
        env:
          FINDING_IDS: ${{ steps.validate.outputs.ids }}
        run: |
          status=0
          arata review -c "$ARATA_CONFIG_DIR/arata.yaml" --format json --status open,acked,snoozed,resolved \
            >"$RUNNER_TEMP/review.json" 2>"$RUNNER_TEMP/review.log" || status=$?
          jq -Rc 'fromjson? | objects | select(.level != "INFO") | {level, code, source}' "$RUNNER_TEMP/review.log" || true
          : >"$RUNNER_TEMP/finding.json"
          if [ "$status" -eq 0 ]; then
            # 渡した ID のものだけを、ID → 中身 の形で置く (ストアに無い ID は載らない)
            jq -c --arg ids "$FINDING_IDS" '($ids | split(" ")) as $want
              | map(select(.id as $i | $want | index($i)) | {key: .id, value: {check, key, severity, status, first_seen, summary}}) | from_entries' \
              "$RUNNER_TEMP/review.json" >"$RUNNER_TEMP/finding.json" || : >"$RUNNER_TEMP/finding.json"
          fi
          echo "arata review exit=$status"

      # 片付けの表 (playbook の「片付け」) が許さない ack は arata が止める (ACK_REFUSED。high・critical と、重大度の上がる余地の無いもの。ADR 0068)。止める規則はここに書かない (arata の 1 か所)。
      # 止められたら、ログと Summary に案内を出す (refused の出力を Summary の step が読む)。
      # 失敗の見分け: ACK_REFUSED = 表が許さない ack / CONFIG_INVALID = ID が無い・既に resolved・期日が過去・理由に使えない文字 / STORE_CONFLICT = 同時に書かれた (もう一度実行する)。
      # 複数の ID は 1 回の arata に渡す。arata が書く前に全部を確かめ、1 件でも通らなければ何も書かない。ストアへの書き込みは 1 回 (ADR 0080)。
      # ID ごとの結果 (--format json。arata schema triage-result) は実行環境の一時ファイルに置き、Summary の step が読む (ログには出さない)。
      - id: triage
        name: arata ack / snooze / resolve
        timeout-minutes: 10
        env:
          FINDING_IDS: ${{ steps.validate.outputs.ids }}
        run: |
          log="$RUNNER_TEMP/arata.log"
          args=("$ACTION" -c "$ARATA_CONFIG_DIR/arata.yaml")
          if [ "$ACTION" = snooze ]; then
            args+=(--until "$UNTIL")
          fi
          if [ "$FORCE" = true ]; then
            args+=(--force)
          fi
          if [ "$DRY_RUN" = true ]; then
            args+=(--dry-run)
          fi
          # 理由と操作した人はストアに残る (ADR 0068)。理由の形 (見えない文字など) は arata も確かめる
          args+=(--format json --reason "$REASON" --by "$GITHUB_ACTOR")
          read -r -a ids <<<"$FINDING_IDS"
          status=0
          arata "${args[@]}" "${ids[@]}" >"$RUNNER_TEMP/triage.json" 2>"$log" || status=$?
          jq -Rc 'fromjson? | objects | select(.level != "INFO") | {level, code, source}' "$log" || true
          # code は機械が読む値 (人向けの文言は読まない。ADR 0054)
          if jq -Re 'fromjson? | objects | select(.code == "ACK_REFUSED")' "$log" >/dev/null; then
            echo "refused=true" >>"$GITHUB_OUTPUT"
            echo "::error::ACK_REFUSED: ack できない finding がある (どれかは Summary。何も変えていない)。その finding は ack できない (high・critical か、同じ指摘のまま重大度が上がる余地が無い。ack すると後で本物が起きても再報告されない)。正規の主体なら allowlist.yaml を PR で直す (approve に当たる)、期日を決めて見直すなら snooze、直したなら resolve。根拠は arata help ai playbook <check> の「片付け」。終わった出来事だと確かめてどうしても ack するなら force を付けて実行し直す"
          fi
          echo "arata exit=$status"
          exit "$status"

      # 誰が・何を・なぜ、をこの実行の Summary にも残す (ストアにも残り、arata review と報告に出る。ADR 0068)。
      # reason は利用者が書いた文字列なので、コードの囲みに入れて Markdown として解釈させない。
      - id: summary
        name: 記録を Summary に残す
        if: always() && steps.validate.outcome == 'success'
        env:
          FINDING_IDS: ${{ steps.validate.outputs.ids }}
          RESULT: ${{ steps.triage.outcome }}
          REFUSED: ${{ steps.triage.outputs.refused }}
        run: |
          # ID ごとの中身 (操作の前) と結果 (arata の --format json)。読めないファイルは無いものとして扱う
          finding="$RUNNER_TEMP/finding.json"
          result="$RUNNER_TEMP/triage.json"
          jq -e 'objects' "$finding" >/dev/null 2>&1 || finding=/dev/null
          jq -e 'objects' "$result" >/dev/null 2>&1 || result=/dev/null
          read -r -a ids <<<"$FINDING_IDS"
          {
            echo "### arata-triage"
            echo
            echo "| 項目 | 値 |"
            echo "|---|---|"
            echo "| account | \`$ACCOUNT\` |"
            echo "| action | \`$ACTION\` |"
            echo "| findings | ${#ids[@]} 件 |"
            if [ "$ACTION" = snooze ]; then
              echo "| until | \`$UNTIL\` (UTC) |"
            fi
            echo "| force | \`${FORCE:-false}\` |"
            echo "| dry_run | \`${DRY_RUN:-false}\` |"
            echo "| by | \`$GITHUB_ACTOR\` |"
            echo "| result | \`$RESULT\` |"
            echo
            echo "reason:"
            echo
            echo '```text'
            printf '%s\n' "$REASON" | tr '`' "'"
            echo '```'
            echo
            if [ "$DRY_RUN" = true ]; then
              echo "**試し (dry_run)**: 検査だけで、ストアは変えていない。よければ dry_run を外して実行し直す"
              echo
            fi
            # ID ごとの中身 (ログ由来の値) と結果。12 桁の数字 (アカウント ID) は伏せ、改行とバッククォートを除き、200 文字で切ってコードの中に入れる。
            # 止めた ID が 1 件でもあれば、arata は何も書いていない (refused 以外の ID も not_written)
            echo "finding ごと (中身は操作の前):"
            echo
            jq -rn --arg ids "$FINDING_IDS" --slurpfile f "$finding" --slurpfile r "$result" '
              def safe: tostring | gsub("[0-9]{12}"; "************") | gsub("[\r\n]"; " ") | gsub("`"; "'"'"'") | .[0:200];
              ($f[0] // {}) as $found
              | (($r[0] // {}).items // [] | map({key: .id, value: .}) | from_entries) as $res
              | $ids | split(" ")[] as $id
              | ($res[$id]) as $x | ($found[$id]) as $y
              | (if $x == null then "- `\($id)`: 結果は不明 (arata の結果が無い。ログの code を見る)"
                 else "- `\($id)`: 結果 `\($x.result | safe)`"
                   + (if $x.code then " (`\($x.code | safe)`)" else "" end)
                   + (if $x.after then " (`\($x.before | safe)` → `\($x.after | safe)`)" else "" end)
                   + (if $x.forced then " force" else "" end) end),
                (if $y == null then "  - 指摘: ストアから引けなかった (ID の取り違え、または読み取りの失敗)"
                 else "  - check: `\($y.check | safe)` / severity: `\($y.severity | safe)` / status: `\($y.status | safe)` / first_seen: `\($y.first_seen | safe)`",
                   "  - summary: `\($y.summary | safe)`", "  - key: `\($y.key | safe)`" end)'
            if [ "$RESULT" != success ] && [ "$DRY_RUN" != true ]; then
              echo
              echo "止めた ID があるか、書き込みに失敗したので、ストアには何も書いていない (止めた ID を外すか直して、もう一度実行する)"
            fi
            if [ "$REFUSED" = true ]; then
              echo
              echo "**ack は止められました (ACK_REFUSED)**。この finding は ack できません (high・critical か、同じ指摘のまま重大度が上がる余地が無い)。ack すると、後で本物が起きても二度と報告されません。"
              echo
              echo "- 正規の主体だと確かめた: allowlist.yaml を PR で直す (approve に当たる)"
              echo "- 期日を決めて見直す: action を snooze にして until を書く"
              echo "- 直した: action を resolve にする"
              echo
              echo "根拠は \`arata help ai playbook <check>\` の「片付け」。終わった出来事だと確かめたうえでどうしても ack するなら、force を付けて実行し直します (記録に force が残ります)。"
            fi
          } >>"$GITHUB_STEP_SUMMARY"
