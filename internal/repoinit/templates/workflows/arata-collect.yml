@@COLLECT_TITLE@@
# arata repo init --collect-every が書き出したファイル (ADR 0059・0078)。手で直さない: 間隔を変える・やめるときは、
# README.md のコマンドの --collect-every を直して (やめるなら外して) arata repo init --force を流し、PR の差分で確かめる。
# コメントの「説明書」は、arata のリポジトリの examples/github-actions/README.md。
#
# 取得を先に済ませておくと、毎朝の daily は読み直さずに判定だけに近づき、1 回の収集が max_collect に当たって partial になることも減る。
# 集めるのは、CloudTrail の種類と collect: hourly の cloudwatch-logs のソースだけ (ADR 0064・0065)。日の頭から読み直すソースは daily が読む。
@@COLLECT_SLACK@@
name: arata-collect

on:
  schedule:
    # 時刻は UTC。毎時ちょうどは GitHub の定時実行が混み、遅れたり落ちたりするので避ける。
    # 分は記録の遅れ (CloudTrail の ingest_delay の既定 15 分) より後にする (collect: hourly は、終わった時しか読まない)。
    # */N は 0 時を含むので、daily (00:40) の 15 分前に 1 回入る。
    - cron: '@@COLLECT_CRON@@'   # @@COLLECT_EVERY@@ ごと
  # 止まった後に、手で追いつかせる
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash     # -eo pipefail で動く

env:
  ARATA_VERSION: @@ARATA_VERSION@@       # この一式を書き出した arata の版。上げるときは、新しい版の arata repo init --force で書き直す
  AWS_REGION: @@AWS_REGION@@

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # 秘密と OIDC は監査と同じ environment で受け取る (説明書「実行するリポジトリと環境を堅くする」の 5)。
    environment: audit
    strategy:
      fail-fast: false
      matrix:
        account: [@@ACCOUNTS@@]
    # 監査 (arata-audit.yml) と同じ group にして、同じストアへの書き込みを順番にする (ADR 0078 の 3 節)。
    # 別の group だと、取得と daily が同時にストアへ書き、後から確定した方が STORE_CONFLICT で失敗する (daily なら、その日の判定と通知を失う)。
    # 走っている run は中断しない。待っている run も取り消さない (既定の queue: single だと、取得の待ちが、待っていた daily を取り消す)。
    concurrency:
      group: arata-audit-${{ matrix.account }}
      cancel-in-progress: false
      queue: max
    permissions:
      id-token: write   # OIDC で実行用ロールを引き受ける
      contents: read    # 設定ファイルの checkout
    env:
      ACCOUNT: ${{ matrix.account }}
      ARATA_CONFIG_DIR: aws/${{ matrix.account }}
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 取得と照合は監査と同じ step (テストが一致を固定する)。
      # 照合の SHA256SUMS は同じリリースのものなので、壊れた取得は防げるがリリース自体のすり替えは防げない。
      # 公開リポジトリのリリースなら gh attestation verify で来歴も確かめられる (arata の 説明書「来歴の検証」)。
      - id: install
        name: arata と aratam を取得する
        env:
          # arata のリポジトリは公開なので、Release は github.token で読める (ほかのトークンは要らない)
          GH_TOKEN: ${{ github.token }}
        run: |
          dir="$RUNNER_TEMP/arata-bin"
          mkdir -p "$dir"
          # Release の取得は、一時的な失敗 (公開した直後の release not found など) があるので、5・10・15 秒の間を空けて 4 回まで試す。
          # 照合 (SHA256SUMS) は取得の後に 1 回だけ行うので、再試行で弱めない。途中まで落ちたファイルは --clobber で上書きする
          for attempt in 1 2 3 4; do
            if gh release download "$ARATA_VERSION" -R CircleAround/arata -D "$dir" --clobber \
              -p arata-linux-amd64 -p aratam-linux-amd64 -p SHA256SUMS; then
              break
            fi
            if [ "$attempt" = 4 ]; then
              echo "::error::arata の Release ($ARATA_VERSION) を 4 回とも取得できませんでした"
              exit 1
            fi
            sleep $((attempt * 5))
          done
          cd "$dir"
          for name in arata aratam; do
            grep " ${name}-linux-amd64\$" SHA256SUMS | sha256sum --check --strict --quiet -
            install -m 0755 "${name}-linux-amd64" "$name"
          done
          echo "$dir" >>"$GITHUB_PATH"

      # 認証に使う 2 つの秘密が未登録 (空) なら、ここで秘密の名前を出して止める (ADR 0060)。秘密は、最初は 1 つも登録されていない。
      # 足りない名前と、そのまま打てる登録のコマンドは、手元の arata repo check --github が出す (このリポジトリの README.md の 4)。
      # 渡すのは空かどうかを見るためだけで、値は出さない。@@SECRETS_NOTE@@
      - id: secrets
        name: 秘密が登録されていることを確かめる
        timeout-minutes: 2
        env:
          ARATA_RUNNER_ROLE_ARN: ${{ secrets.ARATA_RUNNER_ROLE_ARN }}
          ARATA_AUDIT_ROLE_ARNS: ${{ secrets.ARATA_AUDIT_ROLE_ARNS }}
        run: |
          status=0
          for name in ARATA_RUNNER_ROLE_ARN ARATA_AUDIT_ROLE_ARNS; do
            if [ -z "${!name:-}" ]; then
              echo "::error::秘密 $name が未登録。手元で arata repo check --github を流し、出たコマンドで登録する (README.md の 4)"
              status=1
            fi
          done
          exit "$status"

      # 実行用ロール。権限は監査ロールの引き受けとストアのバケットの読み書きだけにする。
      # ロールの ARN はアカウント ID を含むので secrets に置く (secrets はログで自動的に隠される)。
      - id: aws
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.ARATA_RUNNER_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: arata-audit
          role-duration-seconds: 3600
          mask-aws-account-id: true

      # 2 つの認証を分ける:
      #   監査対象: arata.yaml の aws.profile: arata-audit → 実行用ロールから、そのアカウントの読み取り専用ロールへ連鎖する
      #   ストア:   arata.yaml の store_profile は書かない → SDK の標準の連鎖で実行用ロールのまま書く
      # 監査ロールの ARN は 1 つの secret に JSON でまとめ ({"<アカウント>": "arn:...", ...})、ここで名前から取り出す。
      # secrets[...] の動的な参照は使わない (ジョブにすべての secrets が渡ってしまう)。
      # 取り出した ARN は secret の一部で、自動では隠れないので ::add-mask:: で隠す。jq の出力とエラーはログに出さない。
      - id: aws-config
        name: 監査ロールのプロファイルを書く
        env:
          AUDIT_ROLE_ARNS: ${{ secrets.ARATA_AUDIT_ROLE_ARNS }}
        run: |
          arn="$(jq -r --arg a "$ACCOUNT" '.[$a] | strings' <<<"$AUDIT_ROLE_ARNS" 2>/dev/null)" || arn=""
          case "$arn" in
            arn:aws*:iam::*:role/*) ;;
            *)
              echo "ARATA_AUDIT_ROLE_ARNS に $ACCOUNT の監査ロールの ARN が無い"
              exit 1
              ;;
          esac
          echo "::add-mask::$arn"
          cfg="$RUNNER_TEMP/aws-config"
          umask 077
          cat >"$cfg" <<CONFIG
          [profile arata-audit]
          role_arn = $arn
          credential_source = Environment
          role_session_name = arata-audit
          CONFIG
          echo "AWS_CONFIG_FILE=$cfg" >>"$GITHUB_ENV"

@@FLASH_STEPS@@      # ログの方針は監査と同じ: 出力は実行環境の一時ファイルに書き、Actions には INFO 以外の level / code / source だけを出す。
      # 時間切れは認証の期限 (1 時間) より短くする。切れたら確定せず、次の回が続きから集める。
      # 終了コード 3 (一部のソースが取れなかった、または 1 回の上限 max_collect に当たった) は警告にして、ジョブを成功にする。
      # 追いつきの途中では毎回 max_collect に当たり、次の回が続きから集める。赤にすると追いつきの間ずっと赤になり、本当の失敗が埋もれる。
      # 取れないソースが続けば、daily がそのソースを自分で読み、取れなければ daily の coverage と通知に出る。
      - id: collect
        name: arata collect --incremental
@@COLLECT_IF@@        timeout-minutes: @@COLLECT_TIMEOUT@@
        run: |
          log="$RUNNER_TEMP/arata.log"
          status=0
          arata collect --incremental -c "$ARATA_CONFIG_DIR/arata.yaml" >"$log" 2>&1 || status=$?
          jq -Rc 'fromjson? | objects | select(.level != "INFO") | {level, code, source}' "$log" || true
          echo "arata exit=$status"
          if [ "$status" = 3 ]; then
            echo "::warning::一部のソースが取れなかったか、1 回の上限 (max_collect) に当たりました。続きは次の回が集めます (終了コード 3)"
            exit 0
          fi
          exit "$status"
@@FLASH_ALERT@@